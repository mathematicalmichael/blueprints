<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1b2a">
<title>Blueprint Floorplan Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1b2a;
  --panel: #1b2d45;
  --header: #162235;
  --accent: #e94560;
  --blue: #4fc3f7;
  --muted: rgba(200,220,255,0.55);
  --main: rgba(200,220,255,0.9);
  --border: rgba(79,195,247,0.18);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--main);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ── Header ── */
#hdr {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 8px; background: var(--header);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; flex-wrap: wrap; min-height: 44px;
}
.atitle { font-size: 13px; font-weight: 700; color: var(--blue); margin-right: 2px; white-space: nowrap; }
.hb {
  display: inline-flex; align-items: center; gap: 2px;
  background: rgba(79,195,247,0.07); color: var(--main);
  border: 1px solid var(--border); border-radius: 5px;
  padding: 3px 7px; font-size: 11px; cursor: pointer;
  white-space: nowrap; min-height: 28px; transition: background .15s;
}
.hb:hover, .hb:active { background: rgba(79,195,247,0.2); }
.hb.red { color: #ff7b6b; border-color: rgba(255,123,107,.3); }
.hb.red:hover { background: rgba(255,107,53,.18); }
.hb.on { background:var(--accent); border-color:var(--accent); color:#fff; }
#zs-input { accent-color:var(--accent); vertical-align:middle; width:70px; }
#zs-label, #zs-val { font-size:10px; color:var(--muted); white-space:nowrap; }
#zs-val { min-width:28px; display:inline-block; text-align:right; }
.hsep { width:1px; height:18px; background:var(--border); flex-shrink:0; }

/* ── Canvas ── */
#cw {
  flex:1; position:relative; overflow:hidden; touch-action:none;
}
canvas { display:block; width:100%; height:100%; touch-action:none; }

#hint {
  position:absolute; top:8px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.65); backdrop-filter:blur(4px);
  color:rgba(255,255,255,.85); font-size:11px; padding:3px 12px;
  border-radius:20px; pointer-events:none; z-index:10;
  white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
}
#sbar {
  position:absolute; bottom:5px; right:8px;
  font-size:10px; color:rgba(79,195,247,.5);
  pointer-events:none; z-index:10; font-family:'Courier New',monospace;
}
#scbar {
  position:absolute; bottom:5px; left:8px;
  font-size:10px; color:rgba(79,195,247,.45);
  pointer-events:none; z-index:10;
}

/* ── Toolbar ── */
#tb {
  display:flex; align-items:center; gap:3px;
  padding:5px 7px; background:var(--header);
  border-top:1px solid var(--border); flex-shrink:0;
  overflow-x:auto; scrollbar-width:none;
}
#tb::-webkit-scrollbar { display:none; }
.tbtn {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:1px; flex-shrink:0;
  width:54px; height:54px;
  background:rgba(79,195,247,.05); color:var(--muted);
  border:1px solid var(--border); border-radius:8px;
  font-size:9px; cursor:pointer; transition:all .15s;
}
.tbtn .ico { font-size:20px; line-height:1.1; }
.tbtn:hover { background:rgba(79,195,247,.15); color:var(--main); }
.tbtn.on { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 8px rgba(233,69,96,.5); }

/* ── Properties panel (slide up from bottom) ── */
#pp {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--panel); border-top:2px solid var(--accent);
  padding:8px 12px 12px; transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:100; max-height:58vh; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#pp.open { transform:translateY(0); }

/* ── Layers panel (slide in from right, independent of #pp) ── */
#lp {
  position:fixed; top:0; right:0; bottom:0; width:284px; max-width:86vw;
  background:var(--panel); border-left:2px solid var(--accent);
  padding:10px 12px 14px; transform:translateX(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:120; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
#lp.open { transform:translateX(0); }

/* ── Layers tree (Photoshop-style) ── */
.lgroup { display:flex; align-items:center; gap:3px; padding:4px; margin-top:5px; position:relative;
          border:1px solid var(--border); border-radius:6px; background:rgba(255,255,255,.05); }
.lgroup.active { border-color:var(--blue); background:rgba(79,195,247,.16); }
.lgroup.ghidden .lname { opacity:.4; text-decoration:line-through; }
.lgroup.glocked { background:rgba(201,146,46,.13); }
.lgroup.dragging, .lobj.dragging { opacity:.4; }
.lgroup.drop-before::before, .lgroup.drop-after::after,
.lobj.drop-before::before, .lobj.drop-after::after {
  content:''; position:absolute; left:2px; right:2px; height:2px; background:var(--blue); border-radius:2px; z-index:2; }
.lgroup.drop-before::before, .lobj.drop-before::before { top:-3px; }
.lgroup.drop-after::after,  .lobj.drop-after::after  { bottom:-3px; }
.lgroup.drop-into { box-shadow:inset 0 0 0 2px var(--blue); background:rgba(79,195,247,.14); }
.ldrag, .odrag { cursor:grab; color:var(--muted); flex-shrink:0; touch-action:none; user-select:none;
                 text-align:center; }
.ldrag { font-size:14px; min-width:16px; padding:2px 1px; }
.odrag { font-size:12px; min-width:16px; padding:3px 1px; opacity:.6; }
.lname { flex:1; font-size:12px; color:var(--main); cursor:pointer; white-space:nowrap;
         overflow:hidden; text-overflow:ellipsis; min-width:0; }
.lname-edit { flex:1; min-width:0; height:24px; min-height:0; padding:2px 6px; font-size:12px; }
.lcount { font-size:10px; color:var(--muted); flex-shrink:0; min-width:12px; text-align:center; }
.lactive-tag { font-size:8px; color:var(--blue); flex-shrink:0; }
.lbtn { background:rgba(255,255,255,.07); border:1px solid var(--border); color:var(--main);
        border-radius:4px; min-width:26px; height:26px; font-size:12px; cursor:pointer;
        display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:0 3px; }
.lbtn.xs { min-width:22px; height:22px; font-size:11px; }
.lbtn:hover { background:rgba(79,195,247,.2); }
.lbtn:disabled { opacity:.3; cursor:default; }
.lbtn.del { color:#ff8b7b; }
.lbtn.on { background:rgba(201,146,46,.32); border-color:#c9922e; }
/* object rows inside a group */
.lobj { display:flex; align-items:center; gap:5px; padding:2px 4px 2px 12px; margin-top:2px; position:relative;
        border-radius:5px; background:rgba(255,255,255,.02); }
.lobj.sel { background:rgba(79,195,247,.18); }
.lobj.ohidden .oname { opacity:.4; text-decoration:line-through; }
.oicon { font-size:12px; width:16px; text-align:center; flex-shrink:0; color:var(--blue); }
.oname { flex:1; font-size:11px; color:var(--main); cursor:pointer; white-space:nowrap;
         overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pph { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.pptitle { font-size:13px; font-weight:600; color:var(--blue); }
.ppc { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:0 4px; line-height:1; }
.ppc:hover { color:#fff; }
.pr { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.pl { font-size:10px; color:var(--muted); min-width:52px; flex-shrink:0; }
.pi {
  flex:1; min-width:0; background:rgba(255,255,255,.07); border:1px solid var(--border);
  color:#fff; border-radius:5px; padding:3px 7px; font-size:12px; min-height:27px;
}
.pi:focus { outline:none; border-color:var(--blue); }
.pck { width:18px; height:18px; cursor:pointer; flex-shrink:0; }
/* compact half-width field cell: label sits snug next to its input */
.fld { flex:1; display:flex; align-items:center; gap:5px; min-width:0; }
.fld > .pl { min-width:auto; }
.pbr { display:flex; gap:7px; margin-top:10px; }
.pb { flex:1; padding:7px; border-radius:5px; border:none; font-size:12px; cursor:pointer; min-height:34px; }
.pbdel { background:#b03028; color:#fff; }
.pbsec { background:rgba(255,255,255,.1); color:var(--main); }
.pblock { background:#c9922e; color:#1a1200; }

/* ── Modal ── */
.mo {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.75); backdrop-filter:blur(3px);
  z-index:200; align-items:center; justify-content:center; padding:16px;
}
.mo.open { display:flex; }
.mb {
  background:var(--panel); border-radius:12px; padding:18px;
  width:100%; max-width:420px; border:1px solid var(--border);
}
.mb h3 { margin-bottom:12px; color:var(--blue); font-size:14px; }
.mi {
  width:100%; background:rgba(255,255,255,.07);
  border:1px solid var(--border); color:#fff;
  border-radius:6px; padding:7px 10px; font-size:13px; margin-bottom:7px;
}
.mi:focus { outline:none; border-color:var(--blue); }
.mta { height:66px; resize:vertical; }
.mlbl { font-size:11px; color:var(--muted); margin-bottom:3px; display:block; }
.mf { display:flex; gap:7px; justify-content:flex-end; margin-top:10px; }
.mf button { padding:7px 16px; border-radius:6px; border:none; cursor:pointer; font-size:12px; min-height:34px; }
.mok { background:var(--accent); color:#fff; }
.mcx { background:rgba(255,255,255,.1); color:var(--main); }

/* ── Wall thickness selector ── */
#wt-row { display:none; align-items:center; gap:4px; }
#wt-row.vis { display:flex; }
#wt-label { font-size:10px; color:var(--muted); white-space:nowrap; }
#wt-input { width:46px; background:rgba(79,195,247,.1); border:1px solid var(--border); color:#fff; border-radius:4px; padding:2px 5px; font-size:11px; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <span class="atitle">📐 Blueprint</span>
    <button class="hb" id="bundo" title="Undo (Ctrl+Z)">↩</button>
    <button class="hb" id="bredo" title="Redo (Ctrl+Y)">↪</button>
    <div class="hsep"></div>
    <button class="hb" id="bzin">＋</button>
    <button class="hb" id="bzout">－</button>
    <button class="hb" id="bfit">⊡ Fit</button>
    <div class="hsep"></div>
    <span id="zs-label" title="Scroll-wheel zoom sensitivity">🖱️ Zoom</span>
    <input id="zs-input" type="range" min="0.2" max="3" step="0.1" value="1" title="Scroll-wheel zoom sensitivity">
    <span id="zs-val">1.0×</span>
    <div class="hsep"></div>
    <button class="hb" id="btheme" title="Toggle display style">🌙</button>
    <button class="hb" id="bgrid" title="Toggle grid">⊞</button>
    <button class="hb" id="bedit" title="Toggle edit mode (click opens properties panel; off = click just selects/drags)">✏️ Edit</button>
    <button class="hb" id="blayers" title="Layers">⧉ Layers</button>
    <div class="hsep"></div>
    <div id="wt-row">
      <span id="wt-label">Line&nbsp;t:</span>
      <input id="wt-input" type="number" value="1" min="0.25" max="24" step="0.25" title='Line thickness (inches)'>
      <span id="wt-label2" style="font-size:10px;color:var(--muted)">"</span>
      <div class="hsep"></div>
    </div>
    <button class="hb" id="bexpjson" title="Export state as JSON">📤 Export</button>
    <button class="hb" id="bimpjson" title="Import state from JSON">📥 Import</button>
    <button class="hb" id="bexppng">PNG</button>
    <button class="hb" id="bexpsvg">SVG</button>
    <button class="hb" id="bexppdf">PDF</button>
    <div class="hsep"></div>
    <button class="hb red" id="bclear">Clear</button>
  </div>

  <div id="cw">
    <canvas id="cv"></canvas>
    <div id="hint">Select a tool below to begin drawing</div>
    <div id="sbar">0", 0"</div>
    <div id="scbar"></div>
  </div>

  <div id="tb">
    <button class="tbtn on" data-tool="select"><span class="ico">↖</span>Select</button>
    <button class="tbtn" data-tool="wall"><span class="ico">▬</span>Line</button>
    <button class="tbtn" data-tool="rect"><span class="ico">▭</span>Rect</button>
    <button class="tbtn" data-tool="circ"><span class="ico">◯</span>Circle</button>
    <button class="tbtn" data-tool="door"><span class="ico">🚪</span>Door</button>
    <button class="tbtn" data-tool="window"><span class="ico">🪟</span>Window</button>
    <button class="tbtn" data-tool="beam"><span class="ico">⬛</span>Beam</button>
    <button class="tbtn" data-tool="outlet"><span class="ico">⚡</span>Outlet</button>
    <button class="tbtn" data-tool="conduit"><span class="ico">〰</span>Conduit</button>
    <button class="tbtn" data-tool="light"><span class="ico">💡</span>Light</button>
    <button class="tbtn" data-tool="text"><span class="ico" style="font-style:italic;font-family:serif;font-size:22px">T</span>Label</button>
  </div>
</div>

<!-- Properties panel -->
<div id="pp">
  <div class="pph">
    <span class="pptitle" id="pptitle">Properties</span>
    <button class="ppc" id="ppclose">✕</button>
  </div>
  <div id="ppfields"></div>
  <div class="pbr">
    <button class="pb pbsec" id="pplock">🔒 Lock</button>
    <button class="pb pbsec" id="ppedit">✏ Edit</button>
    <button class="pb pbdel" id="ppdel">Delete</button>
  </div>
</div>

<!-- Layers panel -->
<div id="lp">
  <div class="pph">
    <span class="pptitle">Layers</span>
    <button class="ppc" id="lpclose">✕</button>
  </div>
  <div style="font-size:10px;color:var(--muted);margin-bottom:8px">
    Tap a name = active layer · double-tap = rename · drag ⠿ to reorder · 👁 hide · 🔒 lock (group or object)
  </div>
  <div id="lplist"></div>
  <div class="pbr">
    <button class="pb pbsec" id="lpadd">＋ Add Layer</button>
  </div>
</div>

<!-- Modal -->
<div class="mo" id="modal">
  <div class="mb">
    <h3 id="mtitle">Add Label</h3>
    <label class="mlbl" id="mmlbl">Text</label>
    <input class="mi" id="mmain" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
    <label class="mlbl" style="margin-top:2px">Annotation (optional)</label>
    <textarea class="mi mta" id="manno" placeholder="Notes, dimensions, materials…"></textarea>
    <div class="mf">
      <button class="mcx" id="mcancel">Cancel</button>
      <button class="mok" id="mok">OK</button>
    </div>
  </div>
</div>

<input type="file" id="filin" accept=".json" style="display:none">

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const SNAP   = 0.25;        // inches – finest quarter inch grid (typed precision)
const DZOOM  = 8;           // default pixels per inch
const MINZ   = 0.2;         // allow zooming out far enough to see 10' grid
const MAXZ   = 128;
const DWALT  = 3.5;         // default wall/line thickness (inches – 2x4 stud wall)
const SKEY   = 'bp_v3';
const ZSKEY  = 'bp_zoomsens';  // wheel-zoom sensitivity multiplier — a browser preference, not part of the document
const MXUNDO = 40;

const T = { SEL:'select',WALL:'wall',DOOR:'door',WIN:'window',BEAM:'beam',
            OUT:'outlet',COND:'conduit',LIGHT:'light',TXT:'text',
            RECT:'rect',CIRC:'circ' };

const TLBL = { wall:'Line',door:'Door',window:'Window',beam:'Support Beam',
               outlet:'Outlet',conduit:'Conduit',light:'Light Fixture',text:'Label',
               rect:'Rectangle',circ:'Circle' };

const HINTS = {
  select:'Tap to select · Drag to move · Dbl-tap to edit · ✏️ Edit Mode = auto-open panel · L = lock · Ctrl+C/V = copy/paste',
  wall:'Drag to draw · Shift = orthogonal · Snaps to grid · Set exact Length/Thickness in properties',
  door:'Drag to place door (sets width & direction)',
  window:'Drag along wall to define window',
  beam:'Drag to define support beam rectangle',
  outlet:'Tap / click to place outlet',
  conduit:'Click to add points · Double-click or Esc to finish',
  light:'Drag to define fluorescent light fixture',
  text:'Tap / click to place text label',
  rect:'Drag to define rectangle (furniture, desk, table…)',
  circ:'Drag from center outward to define circle (clearance, radius…)',
};

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let S = { els:[], nid:1 };          // persistent state
let VP = { x:0, y:0, z:DZOOM };    // viewport (x,y = world at canvas center, z = px/in)
let UI = {
  tool:T.SEL, selId:null, hovId:null, editMode:false, zoomSens:1,
  draw:null,          // in-progress draw preview
  condPts:null,       // in-progress conduit points
  curW:null,          // cursor world pos (snapped)
  shift:false,
  grid:true, bp:true, // blueprint dark mode
  dragEl:null, dragging:false, dragOffW:null, dragSnap:null,
  vpDrag:null, rot:null,   // rot = in-progress rotation-handle drag
  defWallT: DWALT,
  activeLayer: null,   // id of layer new elements are added to
};

let undos=[], redos=[];
let clip=null;                       // copy/paste clipboard (single element)

// ═══════════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════════
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', {alpha:false});
const cw  = document.getElementById('cw');

function resize(){
  cv.width  = cw.clientWidth;
  cv.height = cw.clientHeight;
  render();
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════════
// COORDINATE UTILITIES
// ═══════════════════════════════════════════════════════════════
// World → Screen
const scx = (wx) => cv.width /2 + (wx - VP.x)*VP.z;
const scy = (wy) => cv.height/2 + (wy - VP.y)*VP.z;
const scl = (wl) => wl * VP.z;   // world length → screen px

// Screen → World
const wcx = (sx) => (sx - cv.width /2)/VP.z + VP.x;
const wcy = (sy) => (sy - cv.height/2)/VP.z + VP.y;

const snap1 = (v)    => Math.round(v / SNAP) * SNAP;
const snapP  = (x,y) => [snap1(x), snap1(y)];

// Adaptive grid: returns [minor, major] spacing in inches for the current zoom.
// As you zoom out the increments grow: 1' → 5' → 10' … so the outer perimeter
// is easy to lay out on mobile.
function gridSteps(z){
  if(z>=32)   return [0.25, 12];   // ¼"  minor · 1' major
  if(z>=16)   return [0.5,  12];   // ½"  minor · 1' major
  if(z>=6)    return [1,    12];   // 1"  minor · 1' major
  if(z>=2)    return [6,    12];   // 6"  minor · 1' major
  if(z>=0.9)  return [12,   60];   // 1'  minor · 5' major
  if(z>=0.45) return [60,  120];   // 5'  minor · 10' major
  return             [120, 600];   // 10' minor · 50' major
}
// Pointer snap increment follows the finest visible grid cell so drawing/dragging
// snaps to whatever the user can actually see.
function psnap(){ return gridSteps(VP.z)[0]; }
function snapG(v){ const s=psnap(); return Math.round(v/s)*s; }
function snapGP(x,y){ return [snapG(x), snapG(y)]; }

// Parse a dimension string into inches. Accepts:
//   32          → 32"          (bare number = inches)
//   32'         → 384"         (feet)
//   12'-6"  12'6  2' 6"        → feet + inches
//   6"          → 6"
//   12x32  12*32  12×32        → multiply (e.g. 12 in/ft × 32 ft = 384")
// Returns a Number, or null if it can't be parsed.
function parseDim(str){
  if(str==null) return null;
  let s=String(str).trim().toLowerCase()
        .replace(/’/g,"'").replace(/”/g,'"').replace(/×/g,'x')
        .replace(/'\s*-\s*/g,"' ");           // 12'-6"  →  12' 6"
  if(!s) return null;
  // Multiplication of plain numbers
  if(/[x*]/.test(s)){
    const parts=s.split(/[x*]/).map(t=>t.trim());
    if(parts.length>1 && parts.every(t=>/^-?\d*\.?\d+$/.test(t)))
      return parts.reduce((a,t)=>a*parseFloat(t),1);
  }
  let neg=false;
  if(s[0]==='-'){ neg=true; s=s.slice(1); }
  let total=0;
  const ftM=s.match(/(\d*\.?\d+)\s*(?:'|ft|feet|f)/);
  if(ftM){ total+=parseFloat(ftM[1])*12; s=s.replace(ftM[0],' '); }
  const inM=s.match(/(\d*\.?\d+)\s*(?:"|in|inch|inches)/);
  if(inM){ total+=parseFloat(inM[1]); s=s.replace(inM[0],' '); }
  if(!ftM && !inM){
    const bare=s.match(/-?\d*\.?\d+/);
    if(!bare) return null;
    total+=parseFloat(bare[0]);
  } else if(!inM){
    const bare=s.match(/\d*\.?\d+/);            // trailing bare inches: 12' 6
    if(bare) total+=parseFloat(bare[0]);
  }
  return neg?-total:total;
}

function fmtIn(inches) {
  if (inches < 0) return '-' + fmtIn(-inches);
  const ft  = Math.floor(inches / 12);
  const inn = +((inches % 12).toFixed(4));
  const ins = Math.round(inn * 4) / 4;
  if (ft===0) return ins+'"';
  if (ins===0) return ft+"'";
  return ft+"'-"+ins+'"';
}

function saveL(){
  try{ localStorage.setItem(SKEY, JSON.stringify({S,VP})); }catch(_){}
  lpRefresh();   // keep the layers panel in sync with canvas edits
}
// Rebuild the layers tree if it's open (but never while a name is being edited).
function lpRefresh(){

}
function loadL(){

  }catch(_){}
  ensureLayers();
  ensureWindows();
}
function loadZoomSens(){

}

// ═══════════════════════════════════════════════════════════════
// UNDO / REDO
// ═══════════════════════════════════════════════════════════════
const snapSt = () => JSON.stringify({ els:S.els, nid:S.nid, layers:S.layers, nlid:S.nlid });

function pushUndo(){
  undos.push(snapSt());
  if(undos.length>MXUNDO) undos.shift();
  redos=[];
}

function applySt(snap){
  const d=JSON.parse(snap);
  S.els=d.els; S.nid=d.nid;
  if(d.layers){ S.layers=d.layers; S.nlid=d.nlid; }
  ensureLayers();
  ensureWindows();
  UI.selId=null; saveL(); render(); closePP();
  if(document.getElementById('lp').classList.contains('open')) renderLayerList();
}

function undo(){ if(!undos.length)return; redos.push(snapSt()); applySt(undos.pop()); }
function redo(){ if(!redos.length)return; undos.push(snapSt()); applySt(redos.pop()); }

// ═══════════════════════════════════════════════════════════════
// ELEMENTS
// ═══════════════════════════════════════════════════════════════
function genId(){ return 'e'+(S.nid++); }

// ── Layers ──────────────────────────────────────────────────────
// S.layers = [{id,name,visible}] where array order is draw order
// (index 0 = bottom). Elements reference a layer via el.layer.
// Backward compatible: older saves have no layers → one default layer
// is created and every element is assigned to it.
function ensureLayers(){
  if(!Array.isArray(S.layers) || !S.layers.length){
    S.layers=[{id:'L1', name:'Layer 1', visible:true}];
  }
  if(S.nlid==null){
    let mx=0;
    for(const l of S.layers){ const m=/^L(\d+)$/.exec(l.id||''); if(m) mx=Math.max(mx,+m[1]); }
    S.nlid=mx+1;
  }
  for(const l of S.layers){ if(l.visible===undefined) l.visible=true; }
  const def=S.layers[0].id;
  for(const el of S.els){ if(!el.layer || !S.layers.some(l=>l.id===el.layer)) el.layer=def; }
  if(!UI.activeLayer || !S.layers.some(l=>l.id===UI.activeLayer)) UI.activeLayer=def;
}

// Windows are defined by a start point + length + direction: {x,y,len,ang}.
// Backward compatible: older saves store windows as a pair of endpoints
// {x1,y1,x2,y2} → migrate those in place to the new start+length form.
function ensureWindows(){
  for(const el of S.els){
    if(el.type!=='window' || el.len!=null) continue;
    if(el.x1==null) continue;
    const dx=el.x2-el.x1, dy=el.y2-el.y1;
    el.x=el.x1; el.y=el.y1;
    el.len=Math.hypot(dx,dy);
    el.ang=Math.atan2(dy,dx)*180/Math.PI;
    delete el.x1; delete el.y1; delete el.x2; delete el.y2;
  }
}

function getLayer(id){ return S.layers && S.layers.find(l=>l.id===id) || null; }
function layerVisible(id){ const l=getLayer(id); return !l || l.visible!==false; }
function layerLocked(id){ const l=getLayer(id); return !!(l && l.locked); }
// Effective lock: object is immovable if it OR its group is locked.
function elLocked(el){ return !!(el && (el.locked || layerLocked(el.layer))); }

// Elements in draw order (bottom→top), honouring layer order and
// skipping hidden layers. Falls back to raw element order if layers
// haven't been initialised yet.
function drawOrder(){
  if(!Array.isArray(S.layers) || !S.layers.length) return S.els;
  const out=[];
  for(const lay of S.layers){
    if(lay.visible===false) continue;
    for(const el of S.els){ if(el.layer===lay.id && !el.hidden) out.push(el); }
  }
  return out;
}

function addEl(type, props){
  const el={ id:genId(), type, lbl:'', anno:'', ...props };
  if(!el.layer) el.layer = UI.activeLayer || (S.layers&&S.layers[0]&&S.layers[0].id);
  S.els.push(el); saveL(); return el;
}

function getEl(id){ return S.els.find(e=>e.id===id)||null; }

function setEl(id, props){
  const i=S.els.findIndex(e=>e.id===id);
  if(i>=0){ Object.assign(S.els[i],props); saveL(); render(); }
}

function delEl(id){
  pushUndo();
  S.els=S.els.filter(e=>e.id!==id);
  if(UI.selId===id){ UI.selId=null; closePP(); }
  saveL(); render();
}

function moveEl(el, dx, dy){
  switch(el.type){
    case 'wall':
      el.x1=snap1(el.x1+dx); el.y1=snap1(el.y1+dy);
      el.x2=snap1(el.x2+dx); el.y2=snap1(el.y2+dy); break;
    case 'conduit':
      el.pts=el.pts.map(p=>({x:snap1(p.x+dx),y:snap1(p.y+dy)})); break;
    default:
      el.x=snap1(el.x+dx); el.y=snap1(el.y+dy);
  }
}

function anchorW(el){
  switch(el.type){
    case 'wall': return {x:el.x1, y:el.y1};
    case 'conduit': return (el.pts&&el.pts[0])||{x:0,y:0};
    default: return {x:el.x, y:el.y};
  }
}

// Window end point, derived from its start point (x,y), length (len) and
// direction (ang, degrees) — the canonical "start + length" representation.
function winEnd(el){
  const a=(el.ang||0)*Math.PI/180;
  return { x: el.x + Math.cos(a)*(el.len||0), y: el.y + Math.sin(a)*(el.len||0) };
}

// ═══════════════════════════════════════════════════════════════
// BOUNDS & GEOMETRY
// ═══════════════════════════════════════════════════════════════
// Unit vector for the direction a wall's thickness extends. By default it is
// perpendicular to the wall (so thickness is always visible, whatever the
// orientation); el.angle skews/flips which side it comes out from (180 = flip).
function wallNormal(el){
  const th=Math.atan2((el.y2-el.y1),(el.x2-el.x1));
  const a=th + (el.angle||0)*Math.PI/180;
  return [-Math.sin(a), Math.cos(a)];
}

// Rotation helpers for box-shaped elements (rect / beam / light).
function rectCenter(el){ return {x:el.x+(el.w||0)/2, y:el.y+(el.h||0)/2}; }
function rotPt(px,py,cx,cy,deg){
  const a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
  const dx=px-cx, dy=py-cy;
  return {x:cx+dx*c-dy*s, y:cy+dx*s+dy*c};
}
// Describes the rotation handle for a rotatable element, or null.
// pivot = world point rotation happens about; base = handle's world angle
// (deg) when rot=0; reach() = handle distance from pivot in SCREEN px.
// All rotatable types store their angle in `rot`.
function rotInfo(el){
  switch(el.type){
    case 'rect': case 'beam': case 'light': {
      const c=rectCenter(el);
      return { pivot:c, base:-90, reach:()=>scl((el.h||0)/2)+26 };
    }
    case 'door':
      return { pivot:{x:el.x,y:el.y}, base:0, reach:()=>Math.max(scl(el.width||30),24) };
    case 'outlet':
      return { pivot:{x:el.x,y:el.y}, base:-90, reach:()=>Math.max(9,VP.z*1.5)+22 };
    case 'text':
      return { pivot:{x:el.x,y:el.y}, base:-90, reach:()=>28 };
    default: return null;
  }
}
function handleScreen(el){
  const ri=rotInfo(el); if(!ri) return null;
  const px=scx(ri.pivot.x), py=scy(ri.pivot.y);
  const ang=(ri.base+(el.rot||0))*Math.PI/180, r=ri.reach();
  return { px, py, hx:px+Math.cos(ang)*r, hy:py+Math.sin(ang)*r, base:ri.base };
}

// Axis-aligned bounds of a possibly-rotated box.
function boxBounds(el){
  const w=el.w||0, h=el.h||0, rot=el.rot||0;
  if(!rot) return {x1:el.x, y1:el.y, x2:el.x+w, y2:el.y+h};
  const c=rectCenter(el);
  const pts=[[el.x,el.y],[el.x+w,el.y],[el.x+w,el.y+h],[el.x,el.y+h]]
    .map(([px,py])=>rotPt(px,py,c.x,c.y,rot));
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  return {x1:Math.min(...xs), y1:Math.min(...ys), x2:Math.max(...xs), y2:Math.max(...ys)};
}

function bounds(el){
  switch(el.type){
    case 'wall': {
      const t=el.t||DWALT;
      const [nx,ny]=wallNormal(el);
      const ox=nx*t, oy=ny*t;
      return {
        x1:Math.min(el.x1,el.x2,el.x1+ox,el.x2+ox),
        y1:Math.min(el.y1,el.y2,el.y1+oy,el.y2+oy),
        x2:Math.max(el.x1,el.x2,el.x1+ox,el.x2+ox),
        y2:Math.max(el.y1,el.y2,el.y1+oy,el.y2+oy)
      };
    }
    case 'window': {
      const e2=winEnd(el);
      return { x1:Math.min(el.x,e2.x), y1:Math.min(el.y,e2.y),
               x2:Math.max(el.x,e2.x), y2:Math.max(el.y,e2.y) };
    }
    case 'beam': case 'light':
      return boxBounds(el);
    case 'rect':
      return boxBounds(el);
    case 'circ':
      return { x1:el.x-(el.r||0), y1:el.y-(el.r||0), x2:el.x+(el.r||0), y2:el.y+(el.r||0) };
    case 'door': {
      const r=el.width||30;
      return { x1:el.x-r, y1:el.y-r, x2:el.x+r, y2:el.y+r };
    }
    case 'outlet':
      return { x1:el.x-1, y1:el.y-1, x2:el.x+1, y2:el.y+1 };
    case 'conduit': {
      if(!el.pts?.length) return null;
      const xs=el.pts.map(p=>p.x), ys=el.pts.map(p=>p.y);
      return { x1:Math.min(...xs), y1:Math.min(...ys), x2:Math.max(...xs), y2:Math.max(...ys) };
    }
    case 'text':
      return { x1:el.x, y1:el.y, x2:el.x+20, y2:el.y+4 };
    default: return null;
  }
}

function allBounds(){
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity,any=false;
  for(const el of drawOrder()){
    const b=bounds(el); if(!b) continue; any=true;
    x1=Math.min(x1,b.x1); y1=Math.min(y1,b.y1);
    x2=Math.max(x2,b.x2); y2=Math.max(y2,b.y2);
  }
  return any?{x1,y1,x2,y2}:null;
}

function ctr(el){ const b=bounds(el); return b?{x:(b.x1+b.x2)/2,y:(b.y1+b.y2)/2}:{x:0,y:0}; }

function ptSegD(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  if(!l2) return Math.hypot(px-ax,py-ay);
  const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

// ═══════════════════════════════════════════════════════════════
// HIT TESTING
// ═══════════════════════════════════════════════════════════════
function hitEl(el, wx2, wy2){
  const pad=Math.max(0.3, 8/VP.z);
  switch(el.type){
    case 'wall': {
      const t=el.t||DWALT;
      const seg=ptSegD(wx2,wy2,el.x1,el.y1,el.x2,el.y2);
      if(seg>t+pad) return false;
      const [ox,oy]=wallNormal(el);
      const dx=el.x2-el.x1, dy=el.y2-el.y1, len=Math.hypot(dx,dy);
      if(len<0.001) return seg<=pad;
      const tu=((wx2-el.x1)*dx+(wy2-el.y1)*dy)/(len*len);
      const tc=Math.max(0,Math.min(1,tu));
      const nx=el.x1+tc*dx, ny=el.y1+tc*dy;
      const comp=(wx2-nx)*ox+(wy2-ny)*oy;
      return comp>=-pad&&comp<=t+pad;
    }
    case 'window': { const e2=winEnd(el); return ptSegD(wx2,wy2,el.x,el.y,e2.x,e2.y) <= pad*2.5; }
    case 'door':   return Math.hypot(wx2-el.x,wy2-el.y) <= (el.width||30)+pad;
    case 'beam': case 'light': case 'rect': {
      // Test in the box's own (un-rotated) frame so rotated boxes hit correctly.
      const w=el.w||0, h=el.h||0, c=rectCenter(el);
      const lp=rotPt(wx2,wy2,c.x,c.y,-(el.rot||0));
      return lp.x>=el.x-pad && lp.x<=el.x+w+pad && lp.y>=el.y-pad && lp.y<=el.y+h+pad;
    }
    case 'circ':   return Math.hypot(wx2-el.x,wy2-el.y)<=(el.r||0)+pad;
    case 'outlet': return Math.hypot(wx2-el.x,wy2-el.y) <= 1.5+pad;
    case 'conduit':{
      if(!el.pts?.length) return false;
      for(let i=0;i<el.pts.length-1;i++)
        if(ptSegD(wx2,wy2,el.pts[i].x,el.pts[i].y,el.pts[i+1].x,el.pts[i+1].y)<=pad*2)
          return true;
      return false;
    }
    case 'text': {
      const fs=(el.fs||12)/12;
      return wx2>=el.x-pad&&wx2<=el.x+30/VP.z&&wy2>=el.y-pad&&wy2<=el.y+fs+pad;
    }
    default: return false;
  }
}

function hitTest(wx2,wy2){
  // Topmost visible layer first, so overlapping objects resolve by layer order.
  const order=drawOrder();
  for(let i=order.length-1;i>=0;i--)
    if(hitEl(order[i],wx2,wy2)) return order[i];
  return null;
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
let rafPending=false;
function reqRender(){ if(!rafPending){rafPending=true;requestAnimationFrame(()=>{rafPending=false;render();});} }

// Color palette
function pal(){
  return UI.bp ? {
    bg:'#0d1b2a', gMin:'rgba(79,195,247,.1)', gMaj:'rgba(79,195,247,.25)',
    gAx:'rgba(79,195,247,.4)', gTxt:'rgba(79,195,247,.32)',
    line:'#9ad4f5', wFill:'#c8e8ff', sel:'#ff6b35', hov:'#ffe066',
    lbl:'rgba(180,225,255,.82)', prev:'#ffe066',
  } : {
    bg:'#f2f2f2', gMin:'rgba(0,0,0,.07)', gMaj:'rgba(0,0,0,.16)',
    gAx:'rgba(0,0,0,.3)', gTxt:'rgba(0,0,0,.28)',
    line:'#111', wFill:'#000', sel:'#e94560', hov:'#0066cc',
    lbl:'rgba(0,0,0,.72)', prev:'#0055cc',
  };
}

function render(){
  const W=cv.width, H=cv.height, p=pal();
  ctx.fillStyle=p.bg; ctx.fillRect(0,0,W,H);
  if(UI.grid) drawGrid(W,H,p);
  for(const el of drawOrder()) drawEl(el,p,el.id===UI.selId,el.id===UI.hovId);
  if(UI.draw) drawPrev(UI.draw,p);
  if(UI.condPts?.length) drawCondPrev(p);
  drawScaleBar(W,H,p);
  updateSbar();
}

// ── Grid ──
function drawGrid(W,H,p){
  const z=VP.z;
  const [mIn,majIn]=gridSteps(z);

  const wL=wcx(0),wT=wcy(0),wR=wcx(W),wB=wcy(H);

  ctx.save();
  ctx.strokeStyle=p.gMin; ctx.lineWidth=0.5;
  ctx.beginPath();
  for(let x=Math.floor(wL/mIn)*mIn;x<=wR;x+=mIn){
    if(Math.abs(x%majIn)>0.001){ctx.moveTo(scx(x),0);ctx.lineTo(scx(x),H);}
  }
  for(let y=Math.floor(wT/mIn)*mIn;y<=wB;y+=mIn){
    if(Math.abs(y%majIn)>0.001){ctx.moveTo(0,scy(y));ctx.lineTo(W,scy(y));}
  }
  ctx.stroke();

  ctx.strokeStyle=p.gMaj; ctx.lineWidth=0.75;
  ctx.beginPath();
  for(let x=Math.floor(wL/majIn)*majIn;x<=wR;x+=majIn){ ctx.moveTo(scx(x),0);ctx.lineTo(scx(x),H); }
  for(let y=Math.floor(wT/majIn)*majIn;y<=wB;y+=majIn){ ctx.moveTo(0,scy(y));ctx.lineTo(W,scy(y)); }
  ctx.stroke();

  ctx.strokeStyle=p.gAx; ctx.lineWidth=1; ctx.setLineDash([5,5]);
  ctx.beginPath();
  const ox=scx(0), oy2=scy(0);
  if(ox>0&&ox<W){ctx.moveTo(ox,0);ctx.lineTo(ox,H);}
  if(oy2>0&&oy2<H){ctx.moveTo(0,oy2);ctx.lineTo(W,oy2);}
  ctx.stroke(); ctx.setLineDash([]);

  if(majIn*z>=34){
    ctx.fillStyle=p.gTxt; ctx.font='9px monospace';
    for(let x=Math.floor(wL/majIn)*majIn;x<=wR;x+=majIn){
      const px=scx(x); if(px>15&&px<W-5) ctx.fillText(Math.round(x/12)+"'",px+2,11);
    }
    for(let y=Math.floor(wT/majIn)*majIn;y<=wB;y+=majIn){
      const py=scy(y); if(py>12&&py<H-5) ctx.fillText(Math.round(y/12)+"'",2,py-2);
    }
  }
  ctx.restore();
}

// ── Scale bar ──
function drawScaleBar(W,H,p){
  const z=VP.z;
  let scIn=12;
  if(z<1) scIn=120;
  else if(z<2) scIn=60;
  else if(z<4) scIn=24;
  else if(z>24) scIn=6;
  else if(z>48) scIn=3;
  const bw=scIn*z, bx=14, by=H-20;
  ctx.save();
  ctx.strokeStyle=UI.bp?'rgba(79,195,247,.6)':'rgba(0,0,0,.45)';
  ctx.fillStyle  =UI.bp?'rgba(79,195,247,.6)':'rgba(0,0,0,.45)';
  ctx.lineWidth=1.5;
  ctx.font='9px monospace';
  ctx.beginPath();
  ctx.moveTo(bx,by); ctx.lineTo(bx+bw,by);
  ctx.moveTo(bx,by-4); ctx.lineTo(bx,by+4);
  ctx.moveTo(bx+bw,by-4); ctx.lineTo(bx+bw,by+4);
  ctx.stroke();
  ctx.fillText(fmtIn(scIn),bx,by-7);
  ctx.restore();
  document.getElementById('scbar').textContent='';
}

// ── Draw one element ──
function drawEl(el, p, sel, hov){
  const base = el.color || p.line;
  const clr = sel?p.sel:(hov?p.hov:base);
  ctx.save();
  ctx.strokeStyle=clr; ctx.fillStyle=clr;
  ctx.lineWidth=sel?2:1.5; ctx.setLineDash([]);
  switch(el.type){
    case 'wall':    rWall(el,clr);    break;
    case 'door':    rDoor(el,clr);    break;
    case 'window':  rWin(el,clr);     break;
    case 'beam':    rBeam(el,clr);    break;
    case 'outlet':  rOutlet(el,clr);  break;
    case 'conduit': rConduit(el,clr,sel); break;
    case 'light':   rLight(el,clr);   break;
    case 'text':    rText(el,clr,sel,p); break;
    case 'rect':    rRect(el,clr);    break;
    case 'circ':    rCirc(el,clr);    break;
  }
  // Label overlay (non-text elements)
  if(el.lbl && el.type!=='text'){
    const c2=ctr(el);
    ctx.font=`${Math.max(8,Math.min(13,VP.z))}px 'Courier New',monospace`;
    ctx.fillStyle=p.lbl;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(el.lbl, scx(c2.x), scy(c2.y));
  }
  // Selection dashed box
  if(sel){
    const b=bounds(el);
    if(b){
      const pad=7/VP.z;
      ctx.strokeStyle=p.sel; ctx.lineWidth=1; ctx.setLineDash([5,3]);
      ctx.strokeRect(scx(b.x1-pad),scy(b.y1-pad),scl(b.x2-b.x1+2*pad),scl(b.y2-b.y1+2*pad));
      ctx.setLineDash([]);
    }
  }
  // Lock indicator
  if(el.locked){
    const b=bounds(el);
    if(b){
      ctx.setLineDash([]);
      ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.globalAlpha=sel?1:0.7;
      ctx.fillText('🔒', scx(b.x2)+3, scy(b.y1)+2);
      ctx.globalAlpha=1;
    }
  }
  // Rotation handle (selected, unlocked, rotatable types)
  if(sel && !elLocked(el)){
    const hs=handleScreen(el);
    if(hs){
      ctx.setLineDash([]); ctx.lineWidth=1.5; ctx.strokeStyle=p.sel;
      ctx.beginPath(); ctx.moveTo(hs.px,hs.py); ctx.lineTo(hs.hx,hs.hy); ctx.stroke();
      ctx.fillStyle=UI.bp?'#0d1b2a':'#fff';
      ctx.beginPath(); ctx.arc(hs.hx,hs.hy,6,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=p.sel;
      ctx.beginPath(); ctx.arc(hs.hx,hs.hy,2,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function rWall(el,clr){
  const x1=scx(el.x1),y1=scy(el.y1),x2=scx(el.x2),y2=scy(el.y2);
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  if(len<1) return;
  const [nx,ny]=wallNormal(el);
  // Perpendicular thickness, clamped so a thin wall never disappears on screen.
  const tk=Math.max(scl(el.t||DWALT), 2);
  const ox=nx*tk, oy=ny*tk;
  ctx.save();
  ctx.fillStyle=clr;
  ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.lineTo(x2+ox,y2+oy); ctx.lineTo(x1+ox,y1+oy);
  ctx.closePath(); ctx.fill();
  // Crisp outline so the wall edges stay legible over the grid.
  ctx.strokeStyle=UI.bp?'rgba(6,20,35,.9)':'rgba(255,255,255,.85)';
  ctx.lineWidth=0.75; ctx.stroke();
  ctx.restore();
}

function rDoor(el,clr){
  const hx=scx(el.x), hy=scy(el.y), r=scl(el.width||30);
  const rotR=(el.rot||0)*Math.PI/180, flip=!!el.flip;
  ctx.save();
  ctx.translate(hx,hy); ctx.rotate(rotR);
  ctx.strokeStyle=clr; ctx.fillStyle=clr; ctx.lineWidth=1.5;
  // Hinge dot
  ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
  // Door panel
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r,0); ctx.stroke();
  // Swing arc  (flip=false → CCW → top-right quadrant; flip=true → CW → bottom-right)
  ctx.beginPath();
  ctx.arc(0,0,r, 0, flip?Math.PI/2:-Math.PI/2, !flip);
  ctx.stroke();
  ctx.restore();
}

function rWin(el,clr){
  const x1=scx(el.x),y1=scy(el.y),len=scl(el.len||0);
  if(Math.abs(len)<1) return;
  const a=(el.ang||0)*Math.PI/180;
  const dep=Math.max(4,Math.min(12,VP.z*1.8));
  ctx.save();
  ctx.translate(x1,y1); ctx.rotate(a);
  ctx.strokeStyle=clr; ctx.lineWidth=1.5;
  ctx.strokeRect(0,-dep/2,len,dep);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len,0); ctx.stroke();
  ctx.restore();
}

function rBeam(el,clr){
  const px=scx(el.x),py=scy(el.y),pw=scl(el.w),ph=scl(el.h);
  if(Math.abs(pw)<2||Math.abs(ph)<2) return;
  ctx.save();
  ctx.translate(px+pw/2,py+ph/2); ctx.rotate((el.rot||0)*Math.PI/180);
  ctx.beginPath(); ctx.rect(-pw/2,-ph/2,pw,ph); ctx.clip();
  ctx.fillStyle=UI.bp?'rgba(168,212,255,.1)':'rgba(0,0,0,.07)';
  ctx.fillRect(-pw/2,-ph/2,pw,ph);
  // diagonal hatch
  ctx.strokeStyle=clr; ctx.lineWidth=0.7;
  ctx.beginPath();
  for(let i=-(Math.abs(pw)+Math.abs(ph));i<(Math.abs(pw)+Math.abs(ph));i+=10){
    ctx.moveTo(i,-ph/2); ctx.lineTo(i+Math.abs(ph),ph/2);
  }
  ctx.stroke();
  ctx.restore();
  // outer border (no clip)
  ctx.save();
  ctx.translate(px+pw/2,py+ph/2); ctx.rotate((el.rot||0)*Math.PI/180);
  ctx.strokeStyle=clr; ctx.lineWidth=2;
  ctx.strokeRect(-pw/2,-ph/2,pw,ph);
  ctx.restore();
}

function rOutlet(el,clr){
  const px=scx(el.x),py=scy(el.y);
  const r=Math.max(6,Math.min(13,VP.z*1.5));
  ctx.save();
  ctx.translate(px,py); ctx.rotate((el.rot||0)*Math.PI/180);
  ctx.strokeStyle=clr; ctx.fillStyle=UI.bp?'rgba(100,170,255,.08)':'rgba(255,255,255,.88)';
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  const sl=r*.45,g=r*.28;
  ctx.beginPath();
  ctx.moveTo(-g,-sl); ctx.lineTo(-g,sl);
  ctx.moveTo( g,-sl); ctx.lineTo( g,sl);
  ctx.stroke();
  // tail to wall
  ctx.beginPath(); ctx.moveTo(0,r); ctx.lineTo(0,r+6); ctx.stroke();
  ctx.restore();
}

function rConduit(el,clr,sel){
  if(!el.pts?.length) return;
  ctx.strokeStyle=clr; ctx.lineWidth=sel?2:1.5; ctx.setLineDash([8,5]);
  ctx.beginPath();
  ctx.moveTo(scx(el.pts[0].x),scy(el.pts[0].y));
  for(let i=1;i<el.pts.length;i++) ctx.lineTo(scx(el.pts[i].x),scy(el.pts[i].y));
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=clr;
  for(const pt of el.pts){ ctx.beginPath();ctx.arc(scx(pt.x),scy(pt.y),3,0,Math.PI*2);ctx.fill(); }
}

function rLight(el,clr){
  const px=scx(el.x),py=scy(el.y),pw=scl(el.w),ph=scl(el.h);
  if(Math.abs(pw)<2||Math.abs(ph)<2) return;
  ctx.save();
  ctx.translate(px+pw/2,py+ph/2); ctx.rotate((el.rot||0)*Math.PI/180);
  ctx.strokeStyle=clr; ctx.lineWidth=1.5;
  ctx.fillStyle=UI.bp?'rgba(168,212,255,.04)':'rgba(255,255,220,.25)';
  ctx.fillRect(-pw/2,-ph/2,pw,ph);
  ctx.strokeRect(-pw/2,-ph/2,pw,ph);
  const tubes=el.tubes||2;
  const isH=Math.abs(pw)>=Math.abs(ph);
  if(isH){
    const sp2=ph/(tubes+1);
    for(let i=1;i<=tubes;i++){
      const ty=-ph/2+i*sp2;
      ctx.beginPath(); ctx.moveTo(-pw/2+4,ty); ctx.lineTo(pw/2-4,ty); ctx.stroke();
    }
  } else {
    const sp2=pw/(tubes+1);
    for(let i=1;i<=tubes;i++){
      const tx=-pw/2+i*sp2;
      ctx.beginPath(); ctx.moveTo(tx,-ph/2+4); ctx.lineTo(tx,ph/2-4); ctx.stroke();
    }
  }
  ctx.restore();
}

function rText(el,clr,sel,p){
  const px=scx(el.x), py=scy(el.y);
  const fs=Math.max(8,Math.min(36,(el.fs||12)*VP.z/8));
  ctx.save();
  ctx.translate(px,py); ctx.rotate((el.rot||0)*Math.PI/180);
  ctx.fillStyle=clr;
  ctx.font=`${fs}px 'Courier New',monospace`;
  ctx.textAlign='left'; ctx.textBaseline='top';
  const txt=el.txt||el.lbl||'';
  ctx.fillText(txt,0,0);
  if(sel&&txt){
    const m=ctx.measureText(txt);
    ctx.strokeStyle=clr; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.strokeRect(-2,-2,m.width+4,fs+4);
    ctx.setLineDash([]);
  }
  if(el.anno&&(sel||VP.z>12)){
    ctx.font=`${Math.max(7,fs*.7)}px sans-serif`;
    ctx.fillStyle=p.lbl;
    ctx.fillText(el.anno,0,fs+3);
  }
  ctx.restore();
}

function rRect(el,clr){
  const pw=scl(el.w||0),ph=scl(el.h||0);
  if(Math.abs(pw)<1||Math.abs(ph)<1) return;
  const c=rectCenter(el);
  ctx.save();
  ctx.translate(scx(c.x),scy(c.y)); ctx.rotate((el.rot||0)*Math.PI/180);
  ctx.strokeStyle=clr; ctx.lineWidth=1.5;
  ctx.fillStyle=UI.bp?'rgba(80,200,120,.07)':'rgba(0,120,60,.05)';
  ctx.fillRect(-pw/2,-ph/2,pw,ph);
  ctx.strokeRect(-pw/2,-ph/2,pw,ph);
  ctx.restore();
}

function rCirc(el,clr){
  if(!(el.r>0)) return;
  const px=scx(el.x),py=scy(el.y),pr=scl(el.r);
  if(pr<1) return;
  ctx.save();
  ctx.strokeStyle=clr; ctx.lineWidth=1.5;
  ctx.fillStyle=UI.bp?'rgba(80,150,255,.06)':'rgba(30,80,200,.04)';
  ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ── Preview while drawing ──
function drawPrev(d,p){
  const clr=p.prev;
  ctx.save();
  ctx.strokeStyle=clr; ctx.fillStyle=clr; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
  switch(d.type){
    case 'wall':{
      const x1=scx(d.x1),y1=scy(d.y1),x2=scx(d.x2),y2=scy(d.y2);
      const tk=Math.max(scl(d.t||DWALT), 2);
      const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
      if(len>0){
        const [nx,ny]=wallNormal(d);
        const ox=nx*tk, oy=ny*tk;
        ctx.save();
        ctx.fillStyle=clr+'88';
        ctx.beginPath();
        ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
        ctx.lineTo(x2+ox,y2+oy); ctx.lineTo(x1+ox,y1+oy);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        const wLen=Math.hypot(d.x2-d.x1,d.y2-d.y1);
        const mx=(x1+x2)/2, my=(y1+y2)/2;
        ctx.setLineDash([]); ctx.fillStyle=clr;
        ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText(fmtIn(wLen),mx,my-4);
      }
      break;
    }
    case 'door':{
      const hx=scx(d.x),hy=scy(d.y),r=scl(d.width||30);
      ctx.save(); ctx.translate(hx,hy); ctx.rotate((d.rot||0)*Math.PI/180);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r,0); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,r,0,d.flip?Math.PI/2:-Math.PI/2,!d.flip); ctx.stroke();
      ctx.restore(); break;
    }
    case 'window':{
      const x1=scx(d.x),y1=scy(d.y),len=scl(d.len||0);
      if(len>1){
        const a=(d.ang||0)*Math.PI/180;
        const dep=Math.max(4,Math.min(12,VP.z*1.8));
        ctx.save(); ctx.translate(x1,y1); ctx.rotate(a);
        ctx.strokeRect(0,-dep/2,len,dep);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len,0); ctx.stroke();
        ctx.restore();
      }
      break;
    }
    case 'beam': case 'light':{
      const px2=scx(d.x),py2=scy(d.y),pw2=scl(d.w),ph2=scl(d.h);
      ctx.fillStyle=clr+'33'; ctx.fillRect(px2,py2,pw2,ph2);
      ctx.strokeRect(px2,py2,pw2,ph2);
      if(Math.abs(d.w)>=SNAP&&Math.abs(d.h)>=SNAP){
        ctx.setLineDash([]); ctx.fillStyle=clr;
        ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(`${fmtIn(Math.abs(d.w))} × ${fmtIn(Math.abs(d.h))}`,px2+pw2/2,py2+ph2/2);
      }
      break;
    }
    case 'outlet':{
      ctx.beginPath(); ctx.arc(scx(d.x),scy(d.y),Math.max(6,VP.z*1.5),0,Math.PI*2); ctx.stroke();
      break;
    }
    case 'rect':{
      const px2=scx(d.x),py2=scy(d.y),pw2=scl(d.w),ph2=scl(d.h);
      ctx.fillStyle=clr+'33'; ctx.fillRect(px2,py2,pw2,ph2);
      ctx.strokeRect(px2,py2,pw2,ph2);
      if(Math.abs(d.w)>=SNAP&&Math.abs(d.h)>=SNAP){
        ctx.setLineDash([]); ctx.fillStyle=clr;
        ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(`${fmtIn(Math.abs(d.w))} × ${fmtIn(Math.abs(d.h))}`,px2+pw2/2,py2+ph2/2);
      }
      break;
    }
    case 'circ':{
      if(d.r>0){
        const pr=scl(d.r);
        ctx.beginPath(); ctx.arc(scx(d.x),scy(d.y),pr,0,Math.PI*2); ctx.stroke();
        ctx.setLineDash([]); ctx.fillStyle=clr;
        ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText('r='+fmtIn(d.r),scx(d.x),scy(d.y)-pr-4);
      }
      break;
    }
  }
  ctx.restore();
}

function drawCondPrev(p){
  const pts=UI.condPts;
  ctx.save();
  ctx.strokeStyle=p.prev; ctx.lineWidth=1.5; ctx.setLineDash([8,5]);
  ctx.beginPath();
  ctx.moveTo(scx(pts[0].x),scy(pts[0].y));
  for(let i=1;i<pts.length;i++) ctx.lineTo(scx(pts[i].x),scy(pts[i].y));
  if(UI.curW) ctx.lineTo(scx(UI.curW.x),scy(UI.curW.y));
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=p.prev;
  for(const pt of pts){ ctx.beginPath();ctx.arc(scx(pt.x),scy(pt.y),4,0,Math.PI*2);ctx.fill(); }
  ctx.restore();
}

function updateSbar(){
  const sb=document.getElementById('sbar');
  if(UI.curW){
    const zp=Math.round(VP.z/DZOOM*100);
    sb.textContent=`${fmtIn(UI.curW.x)}, ${fmtIn(UI.curW.y)} | ${zp}%`;
  }
}

// ═══════════════════════════════════════════════════════════════
// INPUT HANDLING
// ═══════════════════════════════════════════════════════════════
let ptr={down:false,sx0:0,sy0:0,sxL:0,syL:0,moved:false,
         pinch:false,pinchD:0};
let longTm=null;

function gpos(e){ const r=cv.getBoundingClientRect(); return {sx:e.clientX-r.left,sy:e.clientY-r.top}; }
function gposT(t){ const r=cv.getBoundingClientRect(); return {sx:t.clientX-r.left,sy:t.clientY-r.top}; }
function tdist(ts){ return Math.hypot(ts[1].clientX-ts[0].clientX,ts[1].clientY-ts[0].clientY); }
function tctr(ts,r){ return {sx:(ts[0].clientX+ts[1].clientX)/2-r.left, sy:(ts[0].clientY+ts[1].clientY)/2-r.top}; }

// MOUSE
cv.addEventListener('mousedown',e=>{
  e.preventDefault();
  const p=gpos(e);
  ptr.down=true; ptr.sx0=p.sx; ptr.sy0=p.sy; ptr.sxL=p.sx; ptr.syL=p.sy; ptr.moved=false;
  UI.shift=e.shiftKey;
  const [cwx2,cwy2]=snapGP(wcx(p.sx),wcy(p.sy));
  toolDown(cwx2,cwy2);
},{passive:false});

cv.addEventListener('mousemove',e=>{
  if(ptr.down) return;   // active drag is handled by the document-level listener below
  e.preventDefault();
  const p=gpos(e);
  const [cwx2,cwy2]=snapGP(wcx(p.sx),wcy(p.sy));
  UI.curW={x:cwx2,y:cwy2}; UI.shift=e.shiftKey;
  toolHover(cwx2,cwy2);
  reqRender();
},{passive:false});

cv.addEventListener('mouseleave',()=>{ if(!ptr.down){ UI.hovId=null; reqRender(); } });

// Once a mouse drag starts, track it on `document` rather than `cv`: selecting a shape
// opens the properties panel (a fixed-position sibling of the canvas) immediately, which
// can slide up and visually cover the cursor mid-drag. Since it isn't a descendant of the
// canvas, `cv`-only listeners would stop receiving mousemove/mouseup once that happens,
// silently killing the drag (this is what broke rectangle-drag in Chrome/Safari).
document.addEventListener('mousemove',e=>{
  if(!ptr.down) return;
  e.preventDefault();
  const p=gpos(e);
  const dx=p.sx-ptr.sxL, dy=p.sy-ptr.syL;
  if(Math.abs(p.sx-ptr.sx0)>3||Math.abs(p.sy-ptr.sy0)>3) ptr.moved=true;
  ptr.sxL=p.sx; ptr.syL=p.sy;
  const [cwx2,cwy2]=snapGP(wcx(p.sx),wcy(p.sy));
  UI.curW={x:cwx2,y:cwy2}; UI.shift=e.shiftKey;
  toolDrag(cwx2,cwy2,dx,dy);
  reqRender();
},{passive:false});

document.addEventListener('mouseup',e=>{
  if(!ptr.down) return;
  e.preventDefault();
  const p=gpos(e);
  const [cwx2,cwy2]=snapGP(wcx(p.sx),wcy(p.sy));
  toolUp(cwx2,cwy2,ptr.moved);
  ptr.down=false; reqRender();
},{passive:false});

cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const p=gpos(e);
  const [cwx2,cwy2]=snapGP(wcx(p.sx),wcy(p.sy));
  ctxAction(cwx2,cwy2);
});

cv.addEventListener('dblclick',e=>{
  e.preventDefault();
  const p=gpos(e);
  const [cwx2,cwy2]=snapGP(wcx(p.sx),wcy(p.sy));
  toolDbl(cwx2,cwy2);
});

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const p=gpos(e);
  const wx0=wcx(p.sx),wy0=wcy(p.sy);
  // Scale zoom to the actual scroll distance instead of a fixed step per event —
  // trackpads fire many small-delta events per gesture, so a fixed factor per
  // event made zooming feel wildly over-sensitive there. Clamp deltaY so one
  // big flick (large delta spikes on some mice) can't jump the zoom too far.
  const dy=Math.max(-100,Math.min(100,e.deltaY));
  const f=Math.exp(-dy*0.0009*UI.zoomSens);
  VP.z=Math.max(MINZ,Math.min(MAXZ,VP.z*f));
  VP.x+=wx0-wcx(p.sx); VP.y+=wy0-wcy(p.sy);
  saveL(); reqRender();
},{passive:false});

// TOUCH
cv.addEventListener('touchstart',e=>{
  e.preventDefault(); clearTimeout(longTm);
  if(e.touches.length===2){
    ptr.down=false; ptr.pinch=true;
    ptr.pinchD=tdist(e.touches); return;
  }
  ptr.pinch=false;
  const t=e.touches[0], p=gposT(t);
  ptr.down=true; ptr.sx0=p.sx; ptr.sy0=p.sy; ptr.sxL=p.sx; ptr.syL=p.sy; ptr.moved=false;
  const [cwx2,cwy2]=snapGP(wcx(p.sx),wcy(p.sy));
  UI.curW={x:cwx2,y:cwy2};
  toolDown(cwx2,cwy2);
  longTm=setTimeout(()=>{
    if(!ptr.moved){
      const el=hitTest(cwx2,cwy2);
      if(el){ UI.selId=el.id; showPP(el); render(); }
    }
  },550);
},{passive:false});

cv.addEventListener('touchmove',e=>{
  e.preventDefault(); clearTimeout(longTm);
  if(e.touches.length===2&&ptr.pinch){
    const r2=cv.getBoundingClientRect();
    const nd=tdist(e.touches), nc=tctr(e.touches,r2);
    const wx0=wcx(nc.sx),wy0=wcy(nc.sy);
    VP.z=Math.max(MINZ,Math.min(MAXZ,VP.z*(nd/ptr.pinchD)));
    VP.x+=wx0-wcx(nc.sx); VP.y+=wy0-wcy(nc.sy);
    ptr.pinchD=nd; reqRender(); return;
  }
  if(!e.touches.length) return;
  const t=e.touches[0], p=gposT(t);
  const dx=p.sx-ptr.sxL, dy=p.sy-ptr.syL;
  if(Math.abs(p.sx-ptr.sx0)>5||Math.abs(p.sy-ptr.sy0)>5) ptr.moved=true;
  ptr.sxL=p.sx; ptr.syL=p.sy;
  const [cwx2,cwy2]=snapGP(wcx(p.sx),wcy(p.sy));
  UI.curW={x:cwx2,y:cwy2};
  if(ptr.down) toolDrag(cwx2,cwy2,dx,dy);
  reqRender();
},{passive:false});

cv.addEventListener('touchend',e=>{
  e.preventDefault(); clearTimeout(longTm);
  if(ptr.pinch&&e.touches.length<2){ ptr.pinch=false; saveL(); return; }
  if(!ptr.down) return;
  const ct=e.changedTouches[0], p=gposT(ct);
  const [cwx2,cwy2]=snapGP(wcx(p.sx),wcy(p.sy));
  toolUp(cwx2,cwy2,ptr.moved);
  ptr.down=false; reqRender();
},{passive:false});

// ═══════════════════════════════════════════════════════════════
// TOOL LOGIC
// ═══════════════════════════════════════════════════════════════
function toolDown(cwx2,cwy2){
  switch(UI.tool){
    case T.SEL:   selDown(cwx2,cwy2); break;
    case T.WALL:
      UI.draw={type:'wall',x1:cwx2,y1:cwy2,x2:cwx2,y2:cwy2,t:UI.defWallT,angle:0}; break;
    case T.DOOR:
      UI.draw={type:'door',x:cwx2,y:cwy2,width:30,rot:0,flip:false}; break;
    case T.WIN:
      UI.draw={type:'window',x:cwx2,y:cwy2,len:0,ang:0}; break;
    case T.BEAM:
      UI.draw={type:'beam',x:cwx2,y:cwy2,w:0,h:0}; break;
    case T.LIGHT:
      UI.draw={type:'light',x:cwx2,y:cwy2,w:0,h:0,tubes:2}; break;
    case T.OUT:
      pushUndo(); addEl('outlet',{x:cwx2,y:cwy2,rot:0}); break;
    case T.COND:
      if(!UI.condPts) UI.condPts=[];
      UI.condPts.push({x:cwx2,y:cwy2}); break;
    case T.TXT:
      showTextModal(cwx2,cwy2); break;
    case T.RECT:
      UI.draw={type:'rect',x:cwx2,y:cwy2,w:0,h:0}; break;
    case T.CIRC:
      UI.draw={type:'circ',x:cwx2,y:cwy2,r:0}; break;
  }
}

function toolDrag(cwx2,cwy2,dx,dy){
  switch(UI.tool){
    case T.SEL:   selDrag(cwx2,cwy2,dx,dy); break;
    case T.WALL:
      if(UI.draw){
        if(UI.shift){
          const ddx=cwx2-UI.draw.x1,ddy=cwy2-UI.draw.y1;
          const a=Math.round(Math.atan2(ddy,ddx)/(Math.PI/4))*(Math.PI/4);
          const r=Math.hypot(ddx,ddy);
          UI.draw.x2=snap1(UI.draw.x1+r*Math.cos(a));
          UI.draw.y2=snap1(UI.draw.y1+r*Math.sin(a));
        } else { UI.draw.x2=cwx2; UI.draw.y2=cwy2; }
      }
      break;
    case T.DOOR:
      if(UI.draw){
        const ddx=cwx2-UI.draw.x,ddy=cwy2-UI.draw.y;
        UI.draw.width=Math.max(SNAP,snap1(Math.hypot(ddx,ddy)));
        UI.draw.rot=Math.atan2(ddy,ddx)*180/Math.PI;
      }
      break;
    case T.WIN:
      if(UI.draw){
        const ddx=cwx2-UI.draw.x, ddy=cwy2-UI.draw.y;
        UI.draw.len=Math.hypot(ddx,ddy);
        UI.draw.ang=Math.atan2(ddy,ddx)*180/Math.PI;
      }
      break;
    case T.BEAM: case T.LIGHT:
      if(UI.draw){ UI.draw.w=cwx2-UI.draw.x; UI.draw.h=cwy2-UI.draw.y; } break;
    case T.RECT:
      if(UI.draw){ UI.draw.w=cwx2-UI.draw.x; UI.draw.h=cwy2-UI.draw.y; } break;
    case T.CIRC:
      if(UI.draw){ UI.draw.r=Math.max(SNAP,snap1(Math.hypot(cwx2-UI.draw.x,cwy2-UI.draw.y))); } break;
  }
}

function toolUp(cwx2,cwy2,moved){
  switch(UI.tool){
    case T.SEL:   selUp(cwx2,cwy2,moved); break;
    case T.WALL:
      if(UI.draw&&Math.hypot(UI.draw.x2-UI.draw.x1,UI.draw.y2-UI.draw.y1)>=SNAP){
        pushUndo();
        addEl('wall',{x1:UI.draw.x1,y1:UI.draw.y1,x2:UI.draw.x2,y2:UI.draw.y2,t:UI.draw.t,angle:0});
      }
      UI.draw=null; break;
    case T.DOOR:
      if(UI.draw){
        pushUndo();
        addEl('door',{x:UI.draw.x,y:UI.draw.y,width:Math.max(18,UI.draw.width||30),rot:UI.draw.rot||0,flip:false});
      }
      UI.draw=null; break;
    case T.WIN:
      if(UI.draw&&UI.draw.len>=SNAP){
        pushUndo();
        addEl('window',{x:UI.draw.x,y:UI.draw.y,len:UI.draw.len,ang:UI.draw.ang});
      }
      UI.draw=null; break;
    case T.BEAM: case T.LIGHT:
      if(UI.draw&&Math.abs(UI.draw.w)>=SNAP&&Math.abs(UI.draw.h)>=SNAP){
        pushUndo();
        const nx=Math.min(UI.draw.x,UI.draw.x+UI.draw.w);
        const ny=Math.min(UI.draw.y,UI.draw.y+UI.draw.h);
        const nw=Math.abs(UI.draw.w), nh=Math.abs(UI.draw.h);
        const extra=UI.tool===T.LIGHT?{tubes:2}:{};
        addEl(UI.tool===T.LIGHT?'light':'beam',{x:nx,y:ny,w:nw,h:nh,...extra});
      }
      UI.draw=null; break;
    case T.RECT:
      if(UI.draw&&Math.abs(UI.draw.w)>=SNAP&&Math.abs(UI.draw.h)>=SNAP){
        pushUndo();
        const nx2=Math.min(UI.draw.x,UI.draw.x+UI.draw.w);
        const ny2=Math.min(UI.draw.y,UI.draw.y+UI.draw.h);
        addEl('rect',{x:nx2,y:ny2,w:Math.abs(UI.draw.w),h:Math.abs(UI.draw.h)});
      }
      UI.draw=null; break;
    case T.CIRC:
      if(UI.draw&&UI.draw.r>=SNAP){
        pushUndo();
        addEl('circ',{x:UI.draw.x,y:UI.draw.y,r:UI.draw.r});
      }
      UI.draw=null; break;
  }
}

function toolHover(cwx2,cwy2){
  if(UI.tool!==T.SEL){ cv.style.cursor='crosshair'; return; }
  const el=hitTest(cwx2,cwy2);
  const nh=el?el.id:null;
  if(nh!==UI.hovId){ UI.hovId=nh; reqRender(); }
  cv.style.cursor=el?'move':'default';
}

function toolDbl(cwx2,cwy2){
  if(UI.tool===T.COND){ finishCond(); return; }
  if(UI.tool===T.SEL){
    const el=hitTest(cwx2,cwy2);
    if(el){ UI.selId=el.id; showPP(el); render(); }
  }
}

function ctxAction(cwx2,cwy2){
  if(UI.tool===T.COND){ finishCond(); return; }
  const el=hitTest(cwx2,cwy2);
  if(el){ UI.selId=el.id; showPP(el); render(); }
}

function finishCond(){
  if(UI.condPts&&UI.condPts.length>=2){
    pushUndo(); addEl('conduit',{pts:[...UI.condPts]});
  }
  UI.condPts=null; reqRender();
}

// ── Select tool ──
function selDown(cwx2,cwy2){
  // Rotation handle of the already-selected element takes priority over hit-testing.
  if(UI.selId){
    const se=getEl(UI.selId);
    if(se && !elLocked(se)){
      const hs=handleScreen(se);
      if(hs && Math.hypot(ptr.sx0-hs.hx, ptr.sy0-hs.hy)<=20){
        UI.rot={id:se.id, px:hs.px, py:hs.py, base:hs.base, snap:snapSt()};
        UI.dragEl=null; UI.vpDrag=null;
        return;
      }
    }
  }
  const el=hitTest(cwx2,cwy2);
  if(el && !elLocked(el)){
    UI.selId=el.id; UI.dragEl=el; UI.dragging=false;
    UI.dragSnap=snapSt();
    const an=anchorW(el);
    UI.dragOffW={x:cwx2-an.x, y:cwy2-an.y};
    // A single click just selects/drags; opening the properties panel here would cover
    // the canvas and get in the way of dragging. Edit Mode or a double-click opens it.
    if(UI.editMode) showPP(el); else closePP();
    render();
  } else if(el && elLocked(el)){
    // Locked: select (never move — drag pans), show properties only in Edit Mode.
    UI.selId=el.id; UI.dragEl=null;
    UI.vpDrag={x:VP.x,y:VP.y,sx:ptr.sx0,sy:ptr.sy0};
    if(UI.editMode) showPP(el); else closePP();
    render();
  } else {
    UI.selId=null; UI.dragEl=null;
    UI.vpDrag={x:VP.x,y:VP.y,sx:ptr.sx0,sy:ptr.sy0};
    closePP(); render();
  }
}

function selDrag(cwx2,cwy2,dx,dy){
  if(UI.rot){
    const el=getEl(UI.rot.id); if(!el){ UI.rot=null; return; }
    let deg=Math.atan2(ptr.syL-UI.rot.py, ptr.sxL-UI.rot.px)*180/Math.PI - UI.rot.base;
    deg = UI.shift ? Math.round(deg/15)*15 : Math.round(deg);   // Shift = 15° steps
    el.rot=((deg%360)+360)%360;
    reqRender();
    return;
  }
  if(UI.dragEl){
    UI.dragging=true;
    const an=anchorW(UI.dragEl);
    const tgtX=snap1(cwx2-UI.dragOffW.x);
    const tgtY=snap1(cwy2-UI.dragOffW.y);
    const ddx=tgtX-an.x, ddy=tgtY-an.y;
    if(ddx||ddy){ moveEl(UI.dragEl,ddx,ddy); reqRender(); }
  } else if(UI.vpDrag){
    VP.x=UI.vpDrag.x+(UI.vpDrag.sx-ptr.sxL)/VP.z;
    VP.y=UI.vpDrag.y+(UI.vpDrag.sy-ptr.syL)/VP.z;
  }
}

function selUp(cwx2,cwy2,moved){
  if(UI.rot){
    if(UI.rot.snap){ undos.push(UI.rot.snap); if(undos.length>MXUNDO) undos.shift(); redos=[]; }
    const s=UI.selId; UI.rot=null; saveL();
    const e2=s?getEl(s):null; if(e2) showPP(e2);   // refresh Rot° field in panel
    return;
  }
  if(UI.dragEl&&UI.dragging&&UI.dragSnap){
    undos.push(UI.dragSnap); redos=[]; saveL();
  }
  UI.dragEl=null; UI.dragging=false; UI.dragSnap=null; UI.vpDrag=null;
  saveL();
}

// ═══════════════════════════════════════════════════════════════
// PROPERTIES PANEL
// ═══════════════════════════════════════════════════════════════
function showPP(el){
  document.getElementById('pptitle').textContent = TLBL[el.type]||el.type;
  document.getElementById('ppfields').innerHTML  = buildPPF(el);
  document.getElementById('pp').classList.add('open');
  updateLockBtn(el);
  let ppUndoPushed = false;
  const pushOnce=()=>{ if(!ppUndoPushed){ pushUndo(); ppUndoPushed=true; } };
  // Bind changes
  document.querySelectorAll('#ppfields [data-p]').forEach(inp=>{
    const isDim = inp.hasAttribute('data-dim');
    const ev = (inp.type==='checkbox'||isDim) ? 'change' : 'input';
    inp.addEventListener(ev,()=>{
      const cur=getEl(el.id); if(!cur) return;
      const p=inp.dataset.p;
      if(inp.type==='checkbox'){ pushOnce(); setEl(el.id,{[p]:inp.checked}); return; }
      if(isDim){
        const parsed=parseDim(inp.value);
        if(parsed==null){                     // couldn't parse → restore prior value
          const prior = (p==='len'&&cur.type==='wall') ? Math.hypot(cur.x2-cur.x1,cur.y2-cur.y1) : cur[p];
          inp.value=fmtIn(prior||0); return;
        }
        const v=snap1(parsed);
        pushOnce();
        if(p==='len'&&cur.type==='wall'){       // set wall length along its direction
          let ang=Math.atan2(cur.y2-cur.y1,cur.x2-cur.x1);
          if(!isFinite(ang)||(cur.x1===cur.x2&&cur.y1===cur.y2)) ang=0;
          setEl(el.id,{x2:snap1(cur.x1+Math.cos(ang)*v), y2:snap1(cur.y1+Math.sin(ang)*v)});
        } else {
          setEl(el.id,{[p]:v});
        }
        inp.value=fmtIn(v);
        return;
      }
      pushOnce();
      let v;
      if(inp.type==='number') v=parseFloat(inp.value)||0;
      else v=inp.value;                        // text (label/txt/anno) or color hex
      setEl(el.id,{[p]:v});
    });
  });
  // "Auto" color reset
  const rst=document.querySelector('#ppfields [data-clr-reset]');
  if(rst) rst.addEventListener('click',()=>{ pushOnce(); setEl(el.id,{color:null}); const e2=getEl(el.id); if(e2) showPP(e2); });
  lpRefresh();   // reflect the newly-selected object in the layers tree
}

function closePP(){ document.getElementById('pp').classList.remove('open'); lpRefresh(); }

function buildPPF(el){
  const row=(l,h)=>`<div class="pr"><span class="pl">${l}</span>${h}</div>`;   // full-width row
  const cell=(l,h)=>`<div class="fld"><span class="pl">${l}</span>${h}</div>`; // half-width cell
  const row2=(a,b)=>`<div class="pr">${a}${b||''}</div>`;                       // one/two cells
  const ti=(p,v,ph='')=>`<input class="pi" type="text" data-p="${p}" value="${esc(v||'')}" placeholder="${ph}">`;
  // Dimension input: shows feet-inches, accepts 32', 12'-6", 6", 12x32, 384 …
  const di=(p,v)=>`<input class="pi" type="text" autocapitalize="off" autocorrect="off" data-p="${p}" data-dim value="${fmtIn(v||0)}">`;
  const ni=(p,v,mn,mx,st=0.25)=>`<input class="pi" type="number" data-p="${p}" value="${v??0}" min="${mn}" max="${mx}" step="${st}">`;
  const ci=(p,v)=>`<input class="pck" type="checkbox" data-p="${p}" ${v?'checked':''}>`;
  const defColor=UI.bp?'#9ad4f5':'#111111';
  const clr=()=>`<input class="pck" style="width:30px;height:24px;padding:0;border:none;background:none" type="color" data-p="color" value="${el.color||defColor}"><button type="button" data-clr-reset style="margin-left:6px;padding:3px 7px;font-size:10px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.08);color:var(--main);cursor:pointer">Auto</button>`;
  const sel=`<select class="pi" data-p="layer">${(S.layers||[]).map(l=>`<option value="${l.id}"${el.layer===l.id?' selected':''}>${esc(l.name)}</option>`).join('')}</select>`;
  let h='';
  h+=row('Label', ti('lbl',el.lbl,'Optional label'));
  h+=row2(cell('Lock', ci('locked',el.locked)), cell('Layer', sel));
  // Position fields — paired X/Y per row
  if(el.type==='wall'){
    h+=row2(cell('X1', di('x1',el.x1)), cell('Y1', di('y1',el.y1)));
    h+=row2(cell('X2', di('x2',el.x2)), cell('Y2', di('y2',el.y2)));
  } else if(el.type!=='conduit'){
    h+=row2(cell('X', di('x',el.x)), cell('Y', di('y',el.y)));
  }
  switch(el.type){
    case 'wall':
      h+=row2(cell('Len', di('len',Math.hypot((el.x2-el.x1),(el.y2-el.y1)))), cell('Thick', di('t',el.t??DWALT)));
      h+=row2(cell('Side°', ni('angle',el.angle??0,-360,360,15)), cell('Color', clr()));
      break;
    case 'door':
      h+=row2(cell('Width', di('width',el.width??30)), cell('Rot°', ni('rot',el.rot??0,-360,360,15)));
      h+=row2(cell('Flip', ci('flip',el.flip)), '');
      break;
    case 'window':
      h+=row2(cell('Length', di('len',el.len??0)), cell('Angle°', ni('ang',el.ang??0,-360,360,15)));
      break;
    case 'beam': case 'light':
      h+=row2(cell('Width', di('w',el.w??12)), cell('Height', di('h',el.h??12)));
      h+=row2(cell('Rot°', ni('rot',el.rot??0,-360,360,15)), el.type==='light'?cell('Tubes', ni('tubes',el.tubes??2,1,8,1)):'');
      break;
    case 'rect':
      h+=row2(cell('Width', di('w',el.w??24)), cell('Height', di('h',el.h??24)));
      h+=row2(cell('Rot°', ni('rot',el.rot??0,-360,360,15)), cell('Color', clr()));
      break;
    case 'circ':
      h+=row2(cell('Radius', di('r',el.r??12)), cell('Color', clr()));
      break;
    case 'outlet':
      h+=row2(cell('Rot°', ni('rot',el.rot??0,0,360,45)), '');
      break;
    case 'text':
      h+=row('Text', ti('txt',el.txt,'Enter text…'));
      h+=row2(cell('Size', ni('fs',el.fs??12,6,72,1)), cell('Rot°', ni('rot',el.rot??0,-360,360,15)));
      break;
  }
  h+=row('Annotation', ti('anno',el.anno,'Notes, dimensions…'));
  return h;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function updateLockBtn(el){
  const b=document.getElementById('pplock');
  if(!b) return;
  const locked=!!(el&&el.locked);
  b.textContent=locked?'🔓 Unlock':'🔒 Lock';
  b.classList.toggle('pblock', locked);
}

function toggleLock(id){
  const el=getEl(id); if(!el) return;
  pushUndo();
  setEl(id,{locked:!el.locked});
  const e2=getEl(id);
  updateLockBtn(e2);
  const chk=document.querySelector('#ppfields [data-p="locked"]');
  if(chk) chk.checked=!!(e2&&e2.locked);
}

// ── Copy / paste ──
function copySel(){
  const el=UI.selId?getEl(UI.selId):null;
  if(!el) return;
  clip=JSON.parse(JSON.stringify(el));
}
function pasteClip(){
  if(!clip) return;
  pushUndo();
  const {id, ...props}=clip;
  props.locked=false;                 // pasted copy starts movable
  const el=addEl(clip.type, props);
  moveEl(el, 12, 12);                 // offset 1' so the copy is visible
  saveL();
  UI.selId=el.id; UI.tool=T.SEL;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.tool===T.SEL));
  showPP(el); render();
}

document.getElementById('ppclose').addEventListener('click', closePP);
document.getElementById('pplock').addEventListener('click',()=>{ if(UI.selId) toggleLock(UI.selId); });
document.getElementById('ppdel').addEventListener('click',()=>{ if(UI.selId) delEl(UI.selId); });
document.getElementById('ppedit').addEventListener('click',()=>{
  const el=UI.selId?getEl(UI.selId):null;
  if(el) showAnnoModal(el);
});

// LAYERS PANEL

const lpNode=()=>document.getElementById('lp');
function openLP(){ renderLayerList(); lpNode().classList.add('open'); }   // independent of #pp
function closeLP(){ lpNode().classList.remove('open'); }
function lpOpen(){ return lpNode().classList.contains('open'); }

const TICON={wall:'▬',door:'🚪',window:'🪟',beam:'▮',outlet:'⚡',conduit:'〰',
             light:'💡',text:'🆃',rect:'▭',circ:'◯'};
function objName(el){
  if(el.lbl) return el.lbl;
  if(el.type==='text') return el.txt||'Text';
  return (TLBL[el.type]||el.type);
}

// Photoshop-style tree: groups (top-most first) each containing their objects.
function renderLayerList(){
  ensureLayers();
  const byLayer={};
  for(const el of S.els){ (byLayer[el.layer]||(byLayer[el.layer]=[])).push(el); }
  let h='';
  for(let i=S.layers.length-1;i>=0;i--){
    const l=S.layers[i];
    const active=l.id===UI.activeLayer;
    const vis=l.visible!==false, lk=!!l.locked, col=!!l.collapsed;
    const els=byLayer[l.id]||[];
    h+=`<div class="lgroup${active?' active':''}${vis?'':' ghidden'}${lk?' glocked':''}" data-lid="${l.id}">`;
    h+=`<span class="ldrag" title="Drag to reorder">⠿</span>`;
    h+=`<button class="lbtn xs" data-act="collapse" title="Collapse / expand">${col?'▸':'▾'}</button>`;
    h+=`<button class="lbtn" data-act="vis" title="Show / hide group">${vis?'👁':'🚫'}</button>`;
    h+=`<button class="lbtn${lk?' on':''}" data-act="lock" title="Lock / unlock group">${lk?'🔒':'🔓'}</button>`;
    h+=`<span class="lname" data-act="active" title="Tap = active · double-tap = rename">${esc(l.name)}</span>`;
    h+=`<span class="lcount">${els.length}</span>`;
    if(active) h+=`<span class="lactive-tag">active</span>`;
    h+=`<button class="lbtn del" data-act="del" title="Delete group"${S.layers.length<=1?' disabled':''}>🗑</button>`;
    h+=`</div>`;
    if(!col){
      // top-most object first (reverse of draw order within the layer)
      for(let j=els.length-1;j>=0;j--){
        const el=els[j];
        const oh=!!el.hidden, ol=!!el.locked, osel=el.id===UI.selId;
        h+=`<div class="lobj${osel?' sel':''}${oh?' ohidden':''}" data-oid="${el.id}">`;
        h+=`<span class="odrag" title="Drag to another group / reorder">⠿</span>`;
        h+=`<span class="oicon">${TICON[el.type]||'•'}</span>`;
        h+=`<span class="oname" data-oact="osel">${esc(objName(el))}</span>`;
        h+=`<button class="lbtn xs" data-oact="ovis" title="Show / hide">${oh?'🚫':'👁'}</button>`;
        h+=`<button class="lbtn xs${ol?' on':''}" data-oact="olock" title="Lock / unlock">${ol?'🔒':'🔓'}</button>`;
        h+=`</div>`;
      }
    }
  }
  document.getElementById('lplist').innerHTML=h;
}

document.getElementById('lplist').addEventListener('click', e=>{
  // Object-row controls
  const obtn=e.target.closest('[data-oact]');
  if(obtn){
    const oid=e.target.closest('.lobj').dataset.oid;
    const el=getEl(oid); if(!el) return;
    switch(obtn.dataset.oact){
      case 'osel':
        UI.selId=oid; UI.tool=T.SEL;
        document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.tool===T.SEL));
        showPP(el); render(); renderLayerList(); break;
      case 'ovis':
        pushUndo(); el.hidden=!el.hidden; saveL(); render(); renderLayerList(); break;
      case 'olock':
        pushUndo(); el.locked=!el.locked; saveL(); render(); renderLayerList();
        if(UI.selId===oid) updateLockBtn(getEl(oid)); break;
    }
    return;
  }
  // Group controls
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const grp=e.target.closest('.lgroup'); if(!grp) return;
  const lid=grp.dataset.lid;
  const idx=S.layers.findIndex(l=>l.id===lid); if(idx<0) return;
  const l=S.layers[idx];
  switch(btn.dataset.act){
    case 'collapse': l.collapsed=!l.collapsed; renderLayerList(); break;
    case 'vis':  l.visible=!(l.visible!==false); saveL(); render(); renderLayerList(); break;
    case 'lock': pushUndo(); l.locked=!l.locked; saveL(); render(); renderLayerList(); break;
    case 'active': UI.activeLayer=lid; markActiveRow(); break;
    case 'del': {
      if(S.layers.length<=1) break;
      const cnt=S.els.filter(el=>el.layer===lid).length;
      if(cnt>0 && !confirm(`Delete "${l.name}"? Its ${cnt} object(s) will move to the layer below.`)) break;
      pushUndo();
      S.layers.splice(idx,1);
      const fallback=S.layers[Math.max(0,idx-1)].id;
      for(const el of S.els){ if(el.layer===lid) el.layer=fallback; }
      if(UI.activeLayer===lid) UI.activeLayer=fallback;
      saveL(); render(); renderLayerList();
      break;
    }
  }
});

// Update only the active-group highlight (no innerHTML rebuild, so name
// nodes survive for reliable double-click-to-rename).
function markActiveRow(){
  document.querySelectorAll('#lplist .lgroup').forEach(r=>{
    const on=r.dataset.lid===UI.activeLayer;
    r.classList.toggle('active',on);
    let tag=r.querySelector('.lactive-tag');
    if(on && !tag){ tag=document.createElement('span'); tag.className='lactive-tag'; tag.textContent='active';
      const cnt=r.querySelector('.lcount'); if(cnt) cnt.after(tag); }
    else if(!on && tag){ tag.remove(); }
  });
}

// In-place layer rename — stays inside the panel, no browser prompt.
function beginRename(lid){
  const l=getLayer(lid); if(!l) return;
  const row=document.querySelector(`#lplist .lgroup[data-lid="${lid}"]`); if(!row) return;
  const nameEl=row.querySelector('.lname');
  if(!nameEl || row.querySelector('.lname-edit')) return;
  const inp=document.createElement('input');
  inp.className='pi lname-edit'; inp.type='text'; inp.value=l.name;
  inp.setAttribute('autocomplete','off'); inp.setAttribute('spellcheck','false');
  nameEl.replaceWith(inp);
  inp.focus(); inp.select();
  let done=false;
  const commit=(save)=>{
    if(done) return; done=true;
    if(save){
      const nm=inp.value.trim();
      if(nm && nm!==l.name){ pushUndo(); l.name=nm; saveL(); render(); }
    }
    renderLayerList();
  };
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); commit(true); }
    else if(e.key==='Escape'){ e.preventDefault(); commit(false); }
  });
  inp.addEventListener('blur',()=>commit(true));
}

// ── Drag-to-reorder (pointer-based, works with touch) ──
// Groups reorder amongst themselves; objects move between groups / reorder.
let lpDrag=null;
function clearDrops(){
  document.querySelectorAll('#lplist .drop-before,#lplist .drop-after,#lplist .drop-into')
    .forEach(n=>n.classList.remove('drop-before','drop-after','drop-into'));
}

// —— Group drag ——
function positionDrop(y){
  clearDrops();
  const groups=[...document.querySelectorAll('#lplist .lgroup')];
  let beforeLid=null;
  for(const g of groups){
    if(g.dataset.lid===lpDrag.lid) continue;
    const r=g.getBoundingClientRect();
    if(y < r.top + r.height/2){ beforeLid=g.dataset.lid; break; }
  }
  lpDrag.beforeLid=beforeLid;
  if(beforeLid){ document.querySelector(`#lplist .lgroup[data-lid="${beforeLid}"]`).classList.add('drop-before'); }
  else { const others=groups.filter(g=>g.dataset.lid!==lpDrag.lid); if(others.length) others[others.length-1].classList.add('drop-after'); }
}
function finishDrag(){
  let disp=[...document.querySelectorAll('#lplist .lgroup')].map(x=>x.dataset.lid).filter(id=>id!==lpDrag.lid);
  const at = lpDrag.beforeLid ? disp.indexOf(lpDrag.beforeLid) : disp.length;
  disp.splice(at,0,lpDrag.lid);
  const newOrder=disp.slice().reverse().map(id=>getLayer(id)).filter(Boolean);   // display top-first → array bottom-first
  const changed = newOrder.length===S.layers.length && newOrder.map(l=>l.id).join(',')!==S.layers.map(l=>l.id).join(',');
  if(changed){ pushUndo(); S.layers=newOrder; saveL(); render(); }
  lpDrag=null; renderLayerList();
}

// —— Object drag —— determine the target group section and the object to
// drop above (beforeOid), then re-thread the element in S.els.
function positionObjDrop(y){
  clearDrops();
  const groups=[...document.querySelectorAll('#lplist .lgroup')];
  if(!groups.length) return;
  let targetG=null;
  for(let i=0;i<groups.length;i++){
    const top=groups[i].getBoundingClientRect().top;
    const nextTop = i+1<groups.length ? groups[i+1].getBoundingClientRect().top : Infinity;
    if(y>=top && y<nextTop){ targetG=groups[i]; break; }
  }
  if(!targetG) targetG = y < groups[0].getBoundingClientRect().top ? groups[0] : groups[groups.length-1];
  // objects displayed under this group's header
  const objs=[]; let n=targetG.nextElementSibling;
  while(n && n.classList.contains('lobj')){ objs.push(n); n=n.nextElementSibling; }
  let beforeOid=null;
  for(const o of objs){ const r=o.getBoundingClientRect(); if(y < r.top+r.height/2){ beforeOid=o.dataset.oid; break; } }
  lpDrag.targetLayer=targetG.dataset.lid; lpDrag.beforeOid=beforeOid;
  targetG.classList.add('drop-into');
  if(beforeOid){ document.querySelector(`#lplist .lobj[data-oid="${beforeOid}"]`).classList.add('drop-before'); }
  else if(objs.length){ objs[objs.length-1].classList.add('drop-after'); }
  else { targetG.classList.add('drop-after'); }
}
// Move object oid into targetLayer, positioned above beforeOid in the panel
// (= drawn after it). beforeOid null → bottom of that group (lowest z).
function moveObject(oid, targetLayer, beforeOid){
  const i=S.els.findIndex(e=>e.id===oid); if(i<0) return;
  const [el]=S.els.splice(i,1);
  el.layer=targetLayer;
  let at;
  if(beforeOid){
    const bi=S.els.findIndex(e=>e.id===beforeOid);
    at = bi<0 ? S.els.length : bi+1;
  } else {
    const firstSib=S.els.findIndex(e=>e.layer===targetLayer);
    at = firstSib<0 ? S.els.length : firstSib;
  }
  S.els.splice(at,0,el);
}
function finishObjDrop(){
  const el=getEl(lpDrag.oid);
  if(el && lpDrag.targetLayer){
    const before=S.els.map(e=>e.id+'@'+e.layer).join(',');
    pushUndo();
    moveObject(lpDrag.oid, lpDrag.targetLayer, lpDrag.beforeOid);
    const after=S.els.map(e=>e.id+'@'+e.layer).join(',');
    if(after===before){ undos.pop(); }         // nothing actually moved
    else { saveL(); render(); }
  }
  lpDrag=null; renderLayerList();
}

document.getElementById('lplist').addEventListener('pointerdown', e=>{
  const gh=e.target.closest('.ldrag'), oh=e.target.closest('.odrag');
  if(!gh && !oh) return;
  e.preventDefault();
  const handle=gh||oh;
  if(gh){
    const grp=gh.closest('.lgroup'); if(!grp) return;
    lpDrag={kind:'group', lid:grp.dataset.lid, beforeLid:null};
    grp.classList.add('dragging');
  } else {
    const obj=oh.closest('.lobj'); if(!obj) return;
    lpDrag={kind:'obj', oid:obj.dataset.oid, targetLayer:null, beforeOid:null};
    obj.classList.add('dragging');
  }
  try{ handle.setPointerCapture(e.pointerId); }catch(_){}
  const move=ev=>{ if(!lpDrag) return; lpDrag.kind==='group'?positionDrop(ev.clientY):positionObjDrop(ev.clientY); };
  const up=()=>{
    handle.removeEventListener('pointermove',move);
    handle.removeEventListener('pointerup',up);
    handle.removeEventListener('pointercancel',up);
    if(lpDrag){ lpDrag.kind==='group'?finishDrag():finishObjDrop(); }
  };
  handle.addEventListener('pointermove',move);
  handle.addEventListener('pointerup',up);
  handle.addEventListener('pointercancel',up);
});

function fitView(){
  const b=allBounds();
  if(!b){ VP.x=0;VP.y=0;VP.z=DZOOM;saveL();render();return; }
  const pad=18;
  const bw=b.x2-b.x1+2*pad, bh=b.y2-b.y1+2*pad;
  VP.z=Math.min(MAXZ,Math.max(MINZ,Math.min(cv.width/bw,cv.height/bh)));
  VP.x=b.x1-pad+bw/2; VP.y=b.y1-pad+bh/2;
  saveL(); render();
}
