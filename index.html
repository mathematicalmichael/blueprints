// EXPORT — shared helpers
// ═══════════════════════════════════════════════════════════════
function exportBounds(){
  const b=allBounds();
  if(!b) return null;
  const pad=18;
  return {x1:b.x1-pad,y1:b.y1-pad,x2:b.x2+pad,y2:b.y2+pad};
}

// Draw all elements in export style onto an arbitrary 2D context
// ox/oy = world-coord offset (top-left corner of export canvas)
// z = pixels per inch for export
function drawExport(ectx, ox, oy, z){
  const esx=(wx2)=>(wx2-ox)*z;
  const esy=(wy2)=>(wy2-oy)*z;
  const esl=(wl2)=>wl2*z;

  ectx.save();
  for(const el of drawOrder()){
    ectx.save();
    const ecol=el.color||'#000';
    ectx.strokeStyle=ecol; ectx.fillStyle=ecol;
    ectx.lineWidth=1.5; ectx.setLineDash([]);

    switch(el.type){
      case 'wall':{
        const x1=esx(el.x1),y1=esy(el.y1),x2=esx(el.x2),y2=esy(el.y2);
        const tk=esl(el.t||DWALT);
        const len=Math.hypot(x2-x1,y2-y1);
        if(len<1){ectx.restore();continue;}
        const [nx,ny]=wallNormal(el);
        const ox=nx*tk, oy=ny*tk;
        ectx.beginPath();
        ectx.moveTo(x1,y1); ectx.lineTo(x2,y2);
        ectx.lineTo(x2+ox,y2+oy); ectx.lineTo(x1+ox,y1+oy);
        ectx.closePath(); ectx.fill(); break;
      }
      case 'door':{
        const hx=esx(el.x),hy=esy(el.y),r=esl(el.width||30);
        const rotR=(el.rot||0)*Math.PI/180, flip=!!el.flip;
        ectx.save();ectx.translate(hx,hy);ectx.rotate(rotR);
        ectx.lineWidth=1.5;
        ectx.beginPath();ectx.arc(0,0,3,0,Math.PI*2);ectx.fill();
        ectx.beginPath();ectx.moveTo(0,0);ectx.lineTo(r,0);ectx.stroke();
        ectx.beginPath();ectx.arc(0,0,r,0,flip?Math.PI/2:-Math.PI/2,!flip);ectx.stroke();
        ectx.restore(); break;
      }
      case 'window':{
        const x1=esx(el.x),y1=esy(el.y),len=esl(el.len||0);
        if(len<1){ectx.restore();continue;}
        const a=(el.ang||0)*Math.PI/180;
        const dep=Math.max(4,esl(4));
        ectx.save();ectx.translate(x1,y1);ectx.rotate(a);
        ectx.strokeRect(0,-dep/2,len,dep);
        ectx.beginPath();ectx.moveTo(0,0);ectx.lineTo(len,0);ectx.stroke();
        ectx.restore(); break;
      }
      case 'beam':{
        const px=esx(el.x),py=esy(el.y),pw=esl(el.w),ph=esl(el.h);
        if(Math.abs(pw)<2||Math.abs(ph)<2){ectx.restore();continue;}
        ectx.save();ectx.translate(px+pw/2,py+ph/2);ectx.rotate((el.rot||0)*Math.PI/180);
        ectx.beginPath();ectx.rect(-pw/2,-ph/2,pw,ph);ectx.clip();
        ectx.fillStyle='rgba(0,0,0,.06)';ectx.fillRect(-pw/2,-ph/2,pw,ph);
        ectx.strokeStyle='#000';ectx.lineWidth=0.75;
        ectx.beginPath();
        for(let i=-(Math.abs(pw)+Math.abs(ph));i<(Math.abs(pw)+Math.abs(ph));i+=8){
          ectx.moveTo(i,-ph/2);ectx.lineTo(i+Math.abs(ph),ph/2);
        }
        ectx.stroke();ectx.restore();
        ectx.save();ectx.translate(px+pw/2,py+ph/2);ectx.rotate((el.rot||0)*Math.PI/180);
        ectx.lineWidth=2;ectx.strokeRect(-pw/2,-ph/2,pw,ph);ectx.restore();
        break;
      }
      case 'outlet':{
        const px=esx(el.x),py=esy(el.y),r=Math.max(6,esl(0.6));
        ectx.save();ectx.translate(px,py);ectx.rotate((el.rot||0)*Math.PI/180);
        ectx.fillStyle='#fff';
        ectx.beginPath();ectx.arc(0,0,r,0,Math.PI*2);ectx.fill();ectx.stroke();
        const sl=r*.45,g=r*.28;
        ectx.beginPath();
        ectx.moveTo(-g,-sl);ectx.lineTo(-g,sl);
        ectx.moveTo( g,-sl);ectx.lineTo( g,sl);
        ectx.stroke();ectx.restore();
        break;
      }
      case 'conduit':{
        if(!el.pts?.length){ectx.restore();continue;}
        ectx.lineWidth=1.5;ectx.setLineDash([7,5]);
        ectx.beginPath();
        ectx.moveTo(esx(el.pts[0].x),esy(el.pts[0].y));
        for(let i=1;i<el.pts.length;i++) ectx.lineTo(esx(el.pts[i].x),esy(el.pts[i].y));
        ectx.stroke();ectx.setLineDash([]);
        for(const pt of el.pts){ ectx.beginPath();ectx.arc(esx(pt.x),esy(pt.y),3,0,Math.PI*2);ectx.fill(); }
        break;
      }
      case 'light':{
        const px=esx(el.x),py=esy(el.y),pw=esl(el.w),ph=esl(el.h);
        if(Math.abs(pw)<2||Math.abs(ph)<2){ectx.restore();continue;}
        ectx.save();ectx.translate(px+pw/2,py+ph/2);ectx.rotate((el.rot||0)*Math.PI/180);
        ectx.fillStyle='rgba(255,255,200,.4)';
        ectx.fillRect(-pw/2,-ph/2,pw,ph);ectx.strokeRect(-pw/2,-ph/2,pw,ph);
        const tubes=el.tubes||2;
        const isH=Math.abs(pw)>=Math.abs(ph);
        if(isH){
          const sp2=ph/(tubes+1);
          for(let i=1;i<=tubes;i++){ const ty=-ph/2+i*sp2;ectx.beginPath();ectx.moveTo(-pw/2+4,ty);ectx.lineTo(pw/2-4,ty);ectx.stroke(); }
        } else {
          const sp2=pw/(tubes+1);
          for(let i=1;i<=tubes;i++){ const tx=-pw/2+i*sp2;ectx.beginPath();ectx.moveTo(tx,-ph/2+4);ectx.lineTo(tx,ph/2-4);ectx.stroke(); }
        }
        ectx.restore(); break;
      }
      case 'rect':{
        const pw=esl(el.w||0),ph=esl(el.h||0);
        if(Math.abs(pw)<1||Math.abs(ph)<1){ectx.restore();continue;}
        const cx=esx(el.x+(el.w||0)/2), cy=esy(el.y+(el.h||0)/2);
        ectx.save(); ectx.translate(cx,cy); ectx.rotate((el.rot||0)*Math.PI/180);
        ectx.fillStyle='rgba(0,0,0,.04)';
        ectx.fillRect(-pw/2,-ph/2,pw,ph);
        ectx.lineWidth=1.5; ectx.strokeStyle=ecol;
        ectx.strokeRect(-pw/2,-ph/2,pw,ph);
        ectx.restore();
        break;
      }
      case 'circ':{
        if(!(el.r>0)){ectx.restore();continue;}
        const px=esx(el.x),py=esy(el.y),pr=esl(el.r);
        ectx.fillStyle='rgba(0,0,0,.04)';
        ectx.beginPath(); ectx.arc(px,py,pr,0,Math.PI*2);
        ectx.fill(); ectx.lineWidth=1.5; ectx.strokeStyle=ecol; ectx.stroke();
        break;
      }
      case 'text':{
        const px=esx(el.x),py=esy(el.y);
        const fs=Math.max(8,Math.min(36,(el.fs||12)*z/8));
        ectx.save();ectx.translate(px,py);ectx.rotate((el.rot||0)*Math.PI/180);
        ectx.fillStyle='#000';
        ectx.font=`${fs}px 'Courier New',monospace`;
        ectx.textAlign='left';ectx.textBaseline='top';
        ectx.fillText(el.txt||el.lbl||'',0,0);
        if(el.anno){
          ectx.font=`${Math.max(7,fs*.7)}px sans-serif`;
          ectx.fillStyle='rgba(0,0,0,.55)';
          ectx.fillText(el.anno,0,fs+3);
        }
        ectx.restore(); break;
      }
    }

    // Label for non-text elements
    if(el.lbl && el.type!=='text'){
      const c2=ctr(el);
      ectx.fillStyle='#333';
      ectx.font=`${Math.max(8,Math.min(12,z))}px 'Courier New',monospace`;
      ectx.textAlign='center';ectx.textBaseline='middle';
      ectx.fillText(el.lbl, esx(c2.x), esy(c2.y));
    }
    ectx.restore();
  }
  ectx.restore();
}

function drawTitleBlock(ectx, W2, H2, z){
  const now=new Date().toLocaleDateString();
  const pad=8;
  ectx.save();
  ectx.strokeStyle='#000'; ectx.fillStyle='#000';
  ectx.lineWidth=1;
  // border
  ectx.strokeRect(pad,pad,W2-2*pad,H2-2*pad);
  // title bar at bottom
  const tbH=Math.max(20,z*2);
  ectx.strokeRect(pad,H2-pad-tbH,W2-2*pad,tbH);
  ectx.font=`bold ${Math.min(14,tbH*.55)}px 'Courier New',monospace`;
  ectx.textAlign='left'; ectx.textBaseline='middle';
  ectx.fillText('FLOOR PLAN', pad+8, H2-pad-tbH/2);
  ectx.font=`${Math.min(10,tbH*.4)}px sans-serif`;
  ectx.textAlign='right';
  ectx.fillText('Scale: 1/4" = 1"  ·  Date: '+now, W2-pad-8, H2-pad-tbH/2);
  ectx.restore();
}

// ── PNG export ──
function exportPNG(){
  const b=exportBounds(); if(!b){alert('Nothing to export.');return;}
  const z=Math.min(20,Math.max(8,900/Math.max(b.x2-b.x1,b.y2-b.y1)));
  const W2=Math.ceil((b.x2-b.x1)*z)+2, H2=Math.ceil((b.y2-b.y1)*z)+2;
  const oc=document.createElement('canvas');
  oc.width=W2; oc.height=H2;
  const oc2=oc.getContext('2d');
  oc2.fillStyle='#fff'; oc2.fillRect(0,0,W2,H2);
  // light foot-grid
  oc2.strokeStyle='rgba(180,200,215,.6)'; oc2.lineWidth=0.5;
  oc2.beginPath();
  for(let x=Math.floor(b.x1/12)*12;x<=b.x2;x+=12){ oc2.moveTo((x-b.x1)*z,0);oc2.lineTo((x-b.x1)*z,H2); }
  for(let y=Math.floor(b.y1/12)*12;y<=b.y2;y+=12){ oc2.moveTo(0,(y-b.y1)*z);oc2.lineTo(W2,(y-b.y1)*z); }
  oc2.stroke();
  drawExport(oc2,b.x1,b.y1,z);
  drawTitleBlock(oc2,W2,H2,z);
  const a=document.createElement('a');
  a.download='floorplan.png'; a.href=oc.toDataURL('image/png'); a.click();
}

// ── SVG export ──
function generateSVG(){
  const b=exportBounds(); if(!b) return null;
  const z=8; // 8px per inch for SVG (scale via viewBox)
  const W2=Math.ceil((b.x2-b.x1)*z)+2, H2=Math.ceil((b.y2-b.y1)*z)+2;
  const ox=b.x1, oy=b.y1;
  const esx=(wx2)=>(wx2-ox)*z;
  const esy=(wy2)=>(wy2-oy)*z;
  const esl=(wl2)=>wl2*z;

  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W2}" height="${H2}" viewBox="0 0 ${W2} ${H2}">
<rect width="${W2}" height="${H2}" fill="white"/>
`;

  // foot grid
  s+=`<g stroke="rgba(180,200,215,0.6)" stroke-width="0.5">`;
  for(let x=Math.floor(b.x1/12)*12;x<=b.x2;x+=12)
    s+=`<line x1="${esx(x)}" y1="0" x2="${esx(x)}" y2="${H2}"/>`;
  for(let y=Math.floor(b.y1/12)*12;y<=b.y2;y+=12)
    s+=`<line x1="0" y1="${esy(y)}" x2="${W2}" y2="${esy(y)}"/>`;
  s+=`</g>`;

  for(const el of drawOrder()){
    switch(el.type){
      case 'wall':{
        const x1=esx(el.x1),y1=esy(el.y1),x2=esx(el.x2),y2=esy(el.y2);
        const tk=esl(el.t||DWALT);
        const len=Math.hypot(x2-x1,y2-y1);
        if(len<1) break;
        const [nx,ny]=wallNormal(el);
        const ox2=nx*tk, oy2=ny*tk;
        s+=`<polygon points="${x1},${y1} ${x2},${y2} ${x2+ox2},${y2+oy2} ${x1+ox2},${y1+oy2}" fill="${el.color||'black'}"/>`;
        break;
      }
      case 'door':{
        const hx=esx(el.x),hy=esy(el.y),r=esl(el.width||30);
        const rotD=(el.rot||0), flip=!!el.flip;
        const endA=(flip?90:-90)*Math.PI/180;
        const lf=flip?0:1; // large-arc-flag=0 for 90°
        const sf=flip?1:0; // sweep-flag: 1=CW(flip), 0=CCW(!flip) in SVG (Y-down)
        const ex=r*Math.cos(endA), ey=r*Math.sin(endA);
        s+=`<g transform="translate(${hx},${hy}) rotate(${rotD})">`;
        s+=`<circle cx="0" cy="0" r="3" fill="black"/>`;
        s+=`<line x1="0" y1="0" x2="${r}" y2="0" stroke="black" stroke-width="1.5" fill="none"/>`;
        s+=`<path d="M ${r} 0 A ${r} ${r} 0 ${lf} ${sf} ${ex} ${ey}" stroke="black" stroke-width="1.5" fill="none"/>`;
        s+=`</g>`;
        break;
      }
      case 'window':{
        const x1=esx(el.x),y1=esy(el.y),len=esl(el.len||0);
        if(len<1) break;
        const a=el.ang||0;
        const dep=Math.max(4,esl(4));
        s+=`<g transform="translate(${x1},${y1}) rotate(${a})">`;
        s+=`<rect x="0" y="${-dep/2}" width="${len}" height="${dep}" stroke="black" stroke-width="1.5" fill="none"/>`;
        s+=`<line x1="0" y1="0" x2="${len}" y2="0" stroke="black" stroke-width="1.5"/>`;
        s+=`</g>`;
        break;
      }
      case 'beam':{
        const px=esx(el.x),py=esy(el.y),pw=esl(el.w),ph=esl(el.h);
        if(!pw||!ph) break;
        const id='hb'+el.id;
        s+=`<clipPath id="${id}"><rect x="${px}" y="${py}" width="${pw}" height="${ph}"/></clipPath>`;
        s+=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="rgba(0,0,0,0.06)" stroke="black" stroke-width="2"/>`;
        s+=`<g clip-path="url(#${id})" stroke="black" stroke-width="0.75">`;
        for(let i=-(pw+ph);i<(pw+ph);i+=8)
          s+=`<line x1="${px+i}" y1="${py}" x2="${px+i+ph}" y2="${py+ph}"/>`;
        s+=`</g>`;
        break;
      }
      case 'outlet':{
        const px=esx(el.x),py=esy(el.y),r=Math.max(6,esl(0.6));
        const rotD=(el.rot||0);
        s+=`<g transform="translate(${px},${py}) rotate(${rotD})">`;
        s+=`<circle cx="0" cy="0" r="${r}" fill="white" stroke="black" stroke-width="1.5"/>`;
        const sl=r*.45,g=r*.28;
        s+=`<line x1="${-g}" y1="${-sl}" x2="${-g}" y2="${sl}" stroke="black" stroke-width="1.5"/>`;
        s+=`<line x1="${g}" y1="${-sl}" x2="${g}" y2="${sl}" stroke="black" stroke-width="1.5"/>`;
        s+=`</g>`;
        break;
      }
      case 'conduit':{
        if(!el.pts?.length) break;
        const pts2=el.pts.map(p=>`${esx(p.x)},${esy(p.y)}`).join(' ');
        s+=`<polyline points="${pts2}" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="7,5"/>`;
        for(const p of el.pts)
          s+=`<circle cx="${esx(p.x)}" cy="${esy(p.y)}" r="3" fill="black"/>`;
        break;
      }
      case 'light':{
        const px=esx(el.x),py=esy(el.y),pw=esl(el.w),ph=esl(el.h);
        if(!pw||!ph) break;
        const tubes=el.tubes||2;
        const isH=Math.abs(pw)>=Math.abs(ph);
        s+=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="rgba(255,255,200,.4)" stroke="black" stroke-width="1.5"/>`;
        if(isH){
          const sp2=ph/(tubes+1);
          for(let i=1;i<=tubes;i++){const ty=py+i*sp2;s+=`<line x1="${px+4}" y1="${ty}" x2="${px+pw-4}" y2="${ty}" stroke="black" stroke-width="1.5"/>`;}
        } else {
          const sp2=pw/(tubes+1);
          for(let i=1;i<=tubes;i++){const tx=px+i*sp2;s+=`<line x1="${tx}" y1="${py+4}" x2="${tx}" y2="${py+ph-4}" stroke="black" stroke-width="1.5"/>`;}
        }
        break;
      }
      case 'rect':{
        const px=esx(el.x),py=esy(el.y),pw=esl(el.w||0),ph=esl(el.h||0);
        if(!pw||!ph) break;
        const cx=esx(el.x+(el.w||0)/2), cy=esy(el.y+(el.h||0)/2);
        s+=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="rgba(0,0,0,0.04)" stroke="${el.color||'black'}" stroke-width="1.5" transform="rotate(${el.rot||0},${cx},${cy})"/>`;
        break;
      }
      case 'circ':{
        if(!(el.r>0)) break;
        const px=esx(el.x),py=esy(el.y),pr=esl(el.r);
        s+=`<circle cx="${px}" cy="${py}" r="${pr}" fill="rgba(0,0,0,0.04)" stroke="${el.color||'black'}" stroke-width="1.5"/>`;
        break;
      }
      case 'text':{
        const px=esx(el.x),py=esy(el.y);
        const fs=Math.max(8,Math.min(24,(el.fs||12)*z/8));
        const rotD=(el.rot||0);
        const txt2=esc(el.txt||el.lbl||'');
        s+=`<text x="${px}" y="${py}" transform="rotate(${rotD},${px},${py})" font-family="'Courier New',monospace" font-size="${fs}" fill="black" dominant-baseline="hanging">${txt2}</text>`;
        if(el.anno){
          const anno2=esc(el.anno);
          s+=`<text x="${px}" y="${py+fs+2}" transform="rotate(${rotD},${px},${py})" font-family="sans-serif" font-size="${Math.max(7,fs*.7)}" fill="rgba(0,0,0,.55)" dominant-baseline="hanging">${anno2}</text>`;
        }
        break;
      }
    }
    // Label
    if(el.lbl && el.type!=='text'){
      const c2=ctr(el);
      const lbl2=esc(el.lbl);
      s+=`<text x="${esx(c2.x)}" y="${esy(c2.y)}" font-family="'Courier New',monospace" font-size="${Math.max(8,Math.min(11,z))}" fill="#333" text-anchor="middle" dominant-baseline="middle">${lbl2}</text>`;
    }
  }

  // Title block
  const now=new Date().toLocaleDateString();
  const tbH=22;
  s+=`<rect x="6" y="6" width="${W2-12}" height="${H2-12}" fill="none" stroke="black" stroke-width="1"/>`;
  s+=`<rect x="6" y="${H2-6-tbH}" width="${W2-12}" height="${tbH}" fill="none" stroke="black" stroke-width="1"/>`;
  s+=`<text x="14" y="${H2-6-tbH/2}" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="black" dominant-baseline="middle">FLOOR PLAN</text>`;
  s+=`<text x="${W2-14}" y="${H2-6-tbH/2}" font-family="sans-serif" font-size="8" fill="black" text-anchor="end" dominant-baseline="middle">Scale: 1/4&quot;=1&quot;  ·  ${now}</text>`;

  s+=`</svg>`;
  return s;
}

function exportSVG(){
  const svg=generateSVG(); if(!svg){alert('Nothing to export.');return;}
  const blob=new Blob([svg],{type:'image/svg+xml'});
  const a=document.createElement('a');
  a.download='floorplan.svg'; a.href=URL.createObjectURL(blob); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function exportPDF(){
  const svg=generateSVG(); if(!svg){alert('Nothing to export.');return;}
  const win=window.open('','_blank');
  if(!win){alert('Pop-up blocked. Please allow pop-ups to export PDF.');return;}
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Floor Plan – Print to PDF</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#fff;}
  .svg-wrap{display:flex;justify-content:center;align-items:flex-start;padding:16px;}
  svg{max-width:100%;height:auto;}
  @media print{body{margin:0;}.svg-wrap{padding:0;}}
</style></head><body>
<div class="svg-wrap">${svg}</div>
<script>window.onload=function(){window.print();}<\/script>
</body></html>`);
  win.document.close();
}

// IMPORT / EXPORT JSON
// ═══════════════════════════════════════════════════════════════
function exportJSON(){
  const data=JSON.stringify({version:'1',state:S,viewport:VP},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.download='floorplan.json'; a.href=URL.createObjectURL(blob); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function importJSON(){
  document.getElementById('filin').click();
}

document.getElementById('filin').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const d=JSON.parse(ev.target.result);
      pushUndo();
      if(d.state){ S={ els:[], nid:1, ...d.state }; }
      if(d.viewport){ VP={...VP,...d.viewport}; }
      ensureLayers();
      ensureWindows();
      saveL(); render(); closePP();
      alert('Imported successfully.');
    } catch(err){
      alert('Import failed: '+err.message);
    }
  };
  reader.readAsText(file);
  e.target.value='';
});

// ═══════════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown', e=>{
  const tag=document.activeElement?.tagName;
  if(['INPUT','TEXTAREA','SELECT'].includes(tag)) return;

  if((e.ctrlKey||e.metaKey)&&e.key==='z'){ e.preventDefault(); undo(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='Z'))){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==='c'||e.key==='C')){ e.preventDefault(); copySel(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==='v'||e.key==='V')){ e.preventDefault(); pasteClip(); return; }
  if(e.key==='Escape'){
    if(UI.condPts) finishCond();
    UI.draw=null; closePP(); closeLP(); closeModal(); reqRender(); return;
  }
  if((e.key==='Delete'||e.key==='Backspace')&&UI.selId){ delEl(UI.selId); return; }
  if(!e.ctrlKey&&!e.metaKey&&(e.key==='l'||e.key==='L')&&UI.selId){ e.preventDefault(); toggleLock(UI.selId); return; }
  if(e.key==='+'||e.key==='='){ VP.z=Math.min(MAXZ,VP.z*1.2); saveL(); reqRender(); }
  if(e.key==='-'){ VP.z=Math.max(MINZ,VP.z/1.2); saveL(); reqRender(); }
  UI.shift=e.shiftKey;

  // Tool shortcuts
  const km={s:T.SEL,w:T.WALL,d:T.DOOR,n:T.WIN,b:T.BEAM,o:T.OUT,c:T.COND,l:T.LIGHT,t:T.TXT};
  if(!e.ctrlKey&&!e.metaKey&&km[e.key]) setTool(km[e.key]);
});
document.addEventListener('keyup', e=>{ UI.shift=e.shiftKey; });

// ═══════════════════════════════════════════════════════════════
// TOOLBAR & HEADER BUTTONS
// ═══════════════════════════════════════════════════════════════
function setTool(tool){
  UI.tool=tool;
  // Cancel any in-progress operations
  UI.draw=null; UI.rot=null;
  if(UI.condPts){ finishCond(); UI.condPts=null; }
  UI.selId=null; closePP();
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.tool===tool));
  document.getElementById('hint').textContent=HINTS[tool]||'';
  // Show wall thickness input when wall tool active
  document.getElementById('wt-row').classList.toggle('vis', tool===T.WALL||tool===T.SEL);
  cv.style.cursor=tool===T.SEL?'default':'crosshair';
  reqRender();
}

document.querySelectorAll('.tbtn').forEach(b=>{
  b.addEventListener('click',()=>setTool(b.dataset.tool));
});

document.getElementById('bundo').addEventListener('click', undo);
document.getElementById('bredo').addEventListener('click', redo);
document.getElementById('bzin').addEventListener('click',()=>{ VP.z=Math.min(MAXZ,VP.z*1.25); saveL(); reqRender(); });
document.getElementById('bzout').addEventListener('click',()=>{ VP.z=Math.max(MINZ,VP.z/1.25); saveL(); reqRender(); });
document.getElementById('bfit').addEventListener('click', fitView);

document.getElementById('btheme').addEventListener('click',()=>{
  UI.bp=!UI.bp;
  document.getElementById('btheme').textContent=UI.bp?'🌙':'☀️';
  reqRender();
});

document.getElementById('bgrid').addEventListener('click',()=>{
  UI.grid=!UI.grid; reqRender();
});

document.getElementById('bedit').addEventListener('click',()=>{
  UI.editMode=!UI.editMode;
  document.getElementById('bedit').classList.toggle('on', UI.editMode);
  if(UI.editMode && UI.selId){ const el=getEl(UI.selId); if(el) showPP(el); }
  else if(!UI.editMode){ closePP(); }
});

document.getElementById('bexpjson').addEventListener('click', exportJSON);
document.getElementById('bimpjson').addEventListener('click', importJSON);
document.getElementById('bexppng').addEventListener('click', exportPNG);
document.getElementById('bexpsvg').addEventListener('click', exportSVG);
document.getElementById('bexppdf').addEventListener('click', exportPDF);

document.getElementById('bclear').addEventListener('click',()=>{
  if(!S.els.length||confirm('Clear all elements?')){
    pushUndo(); S.els=[]; S.nid=1; UI.selId=null;
    saveL(); render(); closePP();
  }
});

document.getElementById('wt-input').addEventListener('input', e=>{
  const v=parseFloat(e.target.value)||DWALT;
  UI.defWallT=Math.max(0.25,v);
});

document.getElementById('zs-input').addEventListener('input', e=>{
  UI.zoomSens=parseFloat(e.target.value)||1;
  document.getElementById('zs-val').textContent=UI.zoomSens.toFixed(1)+'×';
  saveZoomSens();
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
loadL();
loadZoomSens();
resize();
setTool(T.SEL);

// Update hint on load
document.getElementById('hint').textContent = HINTS[T.SEL];
document.getElementById('btheme').textContent = UI.bp?'🌙':'☀️';
document.getElementById('wt-input').value = UI.defWallT;
document.getElementById('zs-input').value = UI.zoomSens;
document.getElementById('zs-val').textContent = UI.zoomSens.toFixed(1)+'×';

</script>
